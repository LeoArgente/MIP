# Publicação gratuita na Render (https://render.com): um serviço web (site + API). O banco fica no Supabase.
# Na Render: New > Blueprint > escolha este repositório. Depois preencha RESEND_API_KEY e APP_URL.
services:
  - type: web
    name: mip
    runtime: node
    # A Render não tem região na América do Sul; Virgínia (leste dos EUA) é a mais próxima do Supabase em sa-east-1.
    # A região só vale na criação do serviço: se ele já existir em outra região, é preciso recriá-lo.
    region: virginia
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      # Banco no Supabase: DATABASE_URL e DIRECT_URL do "Session pooler" (porta 5432); no DATABASE_URL, acrescente ?connection_limit=5.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "MIP <onboarding@resend.dev>"
      - key: DEV_LOGIN
        value: "0"
      # Botão "Feedback" e nota de satisfação. Troque para "0" quando a fase de testes acabar.
      - key: FEEDBACK
        value: "1"
      # E-mails que podem abrir /admin e ler os feedbacks (separados por vírgula).
      - key: ADMIN_EMAILS
        sync: false
      # Versão de teste com usuários: entra com nome e e-mail, sem e-mail de confirmação.
      # Troque para "0" quando tiverem domínio e RESEND_API_KEY funcionando.
      - key: TEST_LOGIN
        value: "1"
