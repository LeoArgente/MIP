# Publicação gratuita na Render (https://render.com): um serviço web (site + API) e um banco PostgreSQL.
# Na Render: New > Blueprint > escolha este repositório. Depois preencha RESEND_API_KEY e APP_URL.
services:
  - type: web
    name: mip
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mip-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "MIP <onboarding@resend.dev>"
      - key: DEV_LOGIN
        value: "0"
      # Versão de teste com usuários: entra com nome e e-mail, sem e-mail de confirmação.
      # Troque para "0" quando tiverem domínio e RESEND_API_KEY funcionando.
      - key: TEST_LOGIN
        value: "1"

databases:
  - name: mip-db
    plan: free
