<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: cabeçalho com troca de pessoa e projeto, trilho de fases, abas por bloco do roadmap, conteúdo em uma coluna de leitura. */
:root{
  --bg:#F4F5F3; --surface:#FFFFFF; --surface2:#EDEFEB; --ink:#18212B; --muted:#5A6572; --line:#D9DDD6;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --ok:#1B7A4B; --ok-soft:#DDF1E5; --warn:#A8520A; --warn-soft:#FBE9D4; --pend:#546072; --pend-soft:#E6E9EE; --bad:#B3261E; --bad-soft:#FBE0DD;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --surface:#1A2129; --surface2:#222B35; --ink:#E7EBEF; --muted:#9AA6B3; --line:#2E3946;
  --accent:#7C9CFF; --accent-ink:#0E1420; --accent-soft:#1F2B4D;
  --ok:#5FCB92; --ok-soft:#163626; --warn:#F0A35A; --warn-soft:#3B2A15; --pend:#A3AEBD; --pend-soft:#262F3A; --bad:#FF8F86; --bad-soft:#3F1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1A2129; --surface2:#222B35; --ink:#E7EBEF; --muted:#9AA6B3; --line:#2E3946;
  --accent:#7C9CFF; --accent-ink:#0E1420; --accent-soft:#1F2B4D;
  --ok:#5FCB92; --ok-soft:#163626; --warn:#F0A35A; --warn-soft:#3B2A15; --pend:#A3AEBD; --pend-soft:#262F3A; --bad:#FF8F86; --bad-soft:#3F1D1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:22px;line-height:1.2} h3{font-size:16px;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--f-display);font-size:20px}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=email],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=text],input[type=email]{width:100%}
select{padding-right:6px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.phases{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
.ph{flex:1 0 120px;padding:9px 12px;font-size:13px;color:var(--muted);border-right:1px solid var(--line);display:flex;gap:8px;align-items:center;white-space:nowrap}
.ph:last-child{border-right:0}
.ph i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line);flex:none}
.ph.done{color:var(--ink)} .ph.done i{background:var(--ok);border-color:var(--ok)}
.ph.now{color:var(--ink);font-weight:600;background:var(--accent-soft)} .ph.now i{background:var(--accent);border-color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
.hus{display:flex;flex-wrap:wrap;gap:4px}
.hu{font-family:var(--f-mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;min-width:0}
.row.start{justify-content:flex-start}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--pend-soft);color:var(--pend);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.banner{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.info{background:var(--accent-soft);border-color:var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:500}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.q{font-weight:600;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.opt input{accent-color:var(--accent);margin:0}
.opt.dis{opacity:.6;cursor:not-allowed}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li>.l{display:flex;flex-direction:column;min-width:0}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cnt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.cnt b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.cnt span{font-size:12px;color:var(--muted)}
.cnt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item.conv{border-left-color:var(--ok)} .item.div{border-left-color:var(--warn)} .item.pend{border-left-color:var(--pend)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.cmp>div{background:var(--surface2);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-width:0;overflow-wrap:anywhere}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6}
.tok{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere;background:var(--surface2);padding:8px 10px;border-radius:6px}
details.demo{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-top:22px;background:var(--surface)}
details.demo summary{cursor:pointer;font-weight:600}
details.demo ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}
#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:500}
#toast div.bad{background:var(--bad);color:#fff}
@media (max-width:560px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))} .paper{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<div id="toast" aria-live="polite"></div>

<script>
/* ===== Constantes ===== */
const QS={contrib:{label:'Quem contribuiu?',multi:true,tag:'contribuinte'},titular:{label:'Quem deve ser titular?',multi:true,tag:'titular'},uso:{label:'Quem pode continuar usando o ativo se sair do projeto?',multi:false}};
const QK=['contrib','titular','uso'];
const USO=['Todos','Só os titulares','Ninguém sem acordo'];
const CATS=['Código','Marca','Design','Conteúdo','Protótipo','Outro'];
const PH=['coleta','encerrada','decisao','confirmacao','consolidado'];
const PHN={coleta:'Coleta aberta',encerrada:'Coleta encerrada',decisao:'Em decisão',confirmacao:'Em confirmação',consolidado:'Consolidado'};
const ST={conv:['Convergente','ok'],div:['Divergente','warn'],pend:['Pendente','']};
const SCEN={
 contrib:[['Lista de contribuições como declarada','Cada pessoa mantém o que informou e a equipe registra as descrições lado a lado.'],['Lista ajustada pela equipe','As pessoas conversam, olham as evidências e combinam uma lista única de quem contribuiu.']],
 titular:[['Titularidade de quem contribuiu','Todas as pessoas que contribuíram passam a ser titulares.'],['Titulares escolhidos pela equipe','A equipe define os titulares mesmo que não coincidam com quem contribuiu e registra o motivo.'],['Titularidade em aberto','O item é marcado como sem acordo e o projeto não fica Consolidado enquanto isso valer.']],
 uso:[['Todos continuam usando','Qualquer integrante pode usar o ativo depois de sair do projeto.'],['Só os titulares continuam usando','Quem sai sem ser titular deixa de usar o ativo.'],['Ninguém usa sem novo acordo','Depois da saída, qualquer uso exige um novo acordo da equipe.']]
};
const LIMITS='Este memorial é um registro preparatório das decisões da equipe. Ele não substitui contrato, advogado ou registro oficial.';

/* ===== Estado ===== */
let people,projects,ui,tt;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>Math.random().toString(36).slice(2,7);
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(', ',' às ');
const cur=()=>projects.find(x=>x.id===ui.pid);
const nm=pid=>people[pid]?people[pid].name:pid;
const mem=(p,pid)=>p.members.find(m=>m.pid===pid);
const elig=p=>p.members.filter(m=>m.status==='ativo'&&m.elig).map(m=>m.pid);
const approved=p=>p.assets.filter(a=>a.st==='ok');
const ansOf=(p,pid,aid)=>p.answers[pid]&&p.answers[pid][aid];
const log=(p,who,text)=>p.history.unshift({at:Date.now(),who,text});
const lastV=p=>p.versions[p.versions.length-1];
function say(t,kind){const el=$('#toast');el.innerHTML='<div class="'+(kind||'')+'">'+esc(t)+'</div>';clearTimeout(tt);tt=setTimeout(()=>{el.innerHTML=''},4500)}
async function copy(t){try{await navigator.clipboard.writeText(t);say('Texto copiado.')}catch(e){say('Não foi possível copiar. Selecione o texto e copie manualmente.','bad')}}
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return ((h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')).repeat(4)}}

function mkProject(id,name,context,org){return{id,name,context,org,phase:'coleta',members:[{pid:org,status:'ativo',elig:true}],link:{active:true,code:rid()},assets:[],answers:{},proposal:{},comments:[],versions:[],history:[],memorials:[],ack:{}}}
function sendAns(p,pid,aid,f,at){p.answers[pid]=p.answers[pid]||{};p.answers[pid][aid]={draft:clone(f),sent:Object.assign(clone(f),{at:at||Date.now()})}}

function seed(){
  people={ana:{name:'Ana',g:'f',email:'ana@email.com'},bruno:{name:'Bruno',g:'m',email:'bruno@email.com'},carla:{name:'Carla',g:'f',email:'carla@email.com'},diego:{name:'Diego',g:'m',email:'diego@email.com'}};
  const p=mkProject('p1','App Rotas','Projeto da disciplina','ana');
  p.members.push({pid:'bruno',status:'ativo',elig:true},{pid:'carla',status:'ativo',elig:true});
  p.assets=[{id:'a1',name:'Logo',cat:'Marca',desc:'Logotipo do app',st:'ok'},{id:'a2',name:'Backend',cat:'Código',desc:'API e servidor de rotas',st:'ok'}];
  sendAns(p,'ana','a1',{contrib:['ana','carla'],titular:['ana','bruno'],uso:'Todos',desc:'Defini o conceito e a paleta do logotipo',link:''});
  sendAns(p,'ana','a2',{contrib:['ana','bruno'],titular:['ana','bruno'],uso:'Todos',desc:'Desenhei a arquitetura e o banco de dados',link:'https://github.com/app-rotas/backend'});
  sendAns(p,'bruno','a1',{contrib:['ana','carla'],titular:['ana','bruno','carla'],uso:'Só os titulares',desc:'',link:''});
  p.answers.bruno.a2={draft:{contrib:['bruno'],titular:[],uso:'',desc:'Criei a API de rotas',link:''},sent:null};
  log(p,'ana','criou o projeto App Rotas');
  const q=mkProject('p2','Jogo X','Game jam de 48 horas','ana');
  q.members.push({pid:'bruno',status:'ativo',elig:true});
  q.assets=[{id:'x1',name:'Trilha sonora',cat:'Conteúdo',desc:'Faixas originais do jogo',st:'ok'}];
  sendAns(q,'ana','x1',{contrib:['ana'],titular:['ana'],uso:'Só os titulares',desc:'Compus as três faixas',link:''});
  log(q,'ana','criou o projeto Jogo X');
  projects=[p,q];
  ui={me:'ana',pid:'p1',tab:'equipe',filter:'todos',open:null,err:{},flag:{},verifyText:'',verify:null,refuse:'',cmt:{},novo:{name:'',ctx:''},inv:'',sug:{name:'',cat:'',desc:''},addA:{name:'',cat:'',desc:''},refSug:{}};
}
function fillDemo(p){
  sendAns(p,'bruno','a1',{contrib:['ana','carla'],titular:['ana','bruno','carla'],uso:'Só os titulares',desc:'',link:''});
  sendAns(p,'bruno','a2',{contrib:['bruno'],titular:['ana','bruno'],uso:'Todos',desc:'Criei a API de rotas',link:'https://github.com/app-rotas/backend/tree/api'});
  sendAns(p,'carla','a1',{contrib:['ana','carla'],titular:['ana','bruno'],uso:'Todos',desc:'Fiz as versões finais do logo',link:'https://figma.com/file/logo-app-rotas'});
  log(p,'sistema','respostas de exemplo preenchidas para a demonstração');
}

/* ===== Regras (HU-15) ===== */
const norm=(v,q)=>QS[q].multi?[...v].sort().join('|'):v;
function itemStatus(p,aid,q){
  const E=elig(p),vals=[];
  E.forEach(pid=>{const a=ansOf(p,pid,aid);if(a&&a.sent)vals.push({pid,v:a.sent[q]})});
  const set=new Set(vals.map(x=>norm(x.v,q)));
  const status=set.size>1?'div':(vals.length===0||vals.length<E.length?'pend':'conv');
  return{status,vals,missing:E.filter(pid=>!vals.find(x=>x.pid===pid))};
}
function origin(p,aid,q){
  if(!QS[q].multi)return[];
  const r=itemStatus(p,aid,q);if(r.status!=='div')return[];
  const all=new Set();r.vals.forEach(x=>x.v.forEach(i=>all.add(i)));
  const out=[];
  all.forEach(pid=>{
    const by=r.vals.filter(x=>x.v.includes(pid)).map(x=>x.pid),not=r.vals.filter(x=>!x.v.includes(pid)).map(x=>x.pid);
    if(not.length===0)return;
    const g=people[pid].g==='f'?'incluída':'incluído';
    out.push(by.length===1?nm(pid)+' foi '+g+' como '+QS[q].tag+' só por '+nm(by[0]):nm(pid)+' foi '+g+' como '+QS[q].tag+' por '+by.map(nm).join(' e ')+', mas não por '+not.map(nm).join(' e '));
  });
  return out;
}
function allItems(p){const o=[];approved(p).forEach(a=>QK.forEach(q=>o.push({aid:a.id,q,key:a.id+':'+q,...itemStatus(p,a.id,q)})));return o}

/* ===== Peças de UI ===== */
const chip=(t,c,dot)=>'<span class="chip '+(c||'')+'">'+(dot?'<i></i>':'')+esc(t)+'</span>';
const hu=s=>'<div class="hus">'+s.split(' ').map(x=>'<span class="hu">'+x+'</span>').join('')+'</div>';
const head=(t,hs,sub)=>'<div class="head"><h2>'+esc(t)+'</h2>'+(sub?'<p class="muted">'+sub+'</p>':'')+hu(hs)+'</div>';
const banner=(t,k,btn)=>'<div class="banner '+(k||'')+'"><span>'+t+'</span>'+(btn||'')+'</div>';
const btn=(act,label,o)=>{o=o||{};return '<button class="btn '+(o.c||'')+'" data-act="'+act+'"'+Object.keys(o.d||{}).map(k=>' data-'+k+'="'+esc(o.d[k])+'"').join('')+(o.dis?' disabled':'')+'>'+label+'</button>'};
const errm=k=>ui.err[k]?'<div class="err" role="alert">'+esc(ui.err[k])+'</div>':'';
const naoElig=()=>banner('Você não é elegível nesta rodada. Entrou depois do encerramento da coleta ou foi marcada como não participante.','info');
const roleTxt=(p,pid)=>p.org===pid?'Organizadora':'Integrante';
function memChip(m){return m.status==='ativo'?(m.elig?chip('Ativo','ok',1):chip('Ativo, não elegível','warn',1)):m.status==='pendente'?chip('Convite pendente','warn',1):chip('Não participante','',1)}

/* ===== Equipe (HU-01 a HU-05, HU-13) ===== */
function vEquipe(p){
  const org=p.org===ui.me;
  let h=head('Equipe',  'HU-01 HU-02 HU-03 HU-04 HU-05 HU-13',esc(p.context||'Sem contexto'));
  if(!p.ack[ui.me])h+=banner('A MIP organiza as decisões da equipe. Ela não substitui contrato, advogado ou registro oficial.','info',btn('ack','Entendi'));
  h+='<div class="card"><div class="row"><h3>Integrantes</h3>'+chip(elig(p).length+' elegíveis','acc')+'</div><div class="list">';
  p.members.forEach(m=>{
    h+='<div class="li"><div class="l"><b>'+esc(nm(m.pid))+'</b><span class="muted" style="font-size:13px">'+roleTxt(p,m.pid)+' · '+esc(people[m.pid].email)+'</span></div><div class="row start">'+memChip(m)+
      (m.status==='pendente'?btn('accept','Simular aceite',{c:'sm',d:{pid:m.pid}}):'')+
      (org&&m.status!=='pendente'&&m.status!=='naopart'?btn('naopart','Marcar como não participante',{c:'sm',d:{pid:m.pid}}):'')+'</div>'+
      (m.status==='naopart'?'<div class="muted" style="font-size:13px;width:100%">Marcada por '+esc(nm(m.by))+' em '+fmt(m.at)+'. Continua na lista e no memorial, mas não conta como pendência.</div>':'')+'</div>';
  });
  h+='</div>'+errm('np')+'</div>';
  if(org){

  }

   '<div class="field"><label for="fd">Descrição</label><input type="text" id="fd" data-in="'+k+'" data-k="desc" value="'+esc(f.desc)+'"></div><div>'+btn(org?'addasset':'sugasset',org?'Cadastrar ativo':'Enviar sugestão',{c:'pri'})+'</div></div>';

/* ===== Respostas (HU-10 a HU-13) ===== */
function ensureAns(p,pid,aid){p.answers[pid]=p.answers[pid]||{};return p.answers[pid][aid]=p.answers[pid][aid]||{draft:{contrib:[],titular:[],uso:'',desc:'',link:''},sent:null}}
function vResp(p){
  const me=ui.me,m=mem(p,me);
  let h=head('Minhas respostas','HU-10 HU-11 HU-12 HU-13','Responda sozinho. Ninguém vê suas respostas antes do encerramento da coleta.');
  if(!m||m.status!=='ativo'||!m.elig)return h+naoElig();
  const open=p.phase==='coleta',E=elig(p);
  if(!open)h+=banner('A coleta foi encerrada. As respostas não podem mais ser alteradas.','warn',btn('tryedit','Tentar alterar',{c:'sm'}));
  const as=approved(p);if(!as.length)h+='<div class="card muted">Ainda não há ativos aprovados para responder.</div>';
  as.forEach(a=>{
    const an=ensureAns(p,me,a.id),d=an.draft,dirty=an.sent?JSON.stringify(d)!==JSON.stringify({contrib:an.sent.contrib,titular:an.sent.titular,uso:an.sent.uso,desc:an.sent.desc,link:an.sent.link}):true;
    h+='<div class="card"><div class="row"><h3>'+esc(a.name)+' <span class="chip">'+esc(a.cat)+'</span></h3>'+(an.sent&&!dirty?chip('Enviado em '+fmt(an.sent.at),'ok',1):an.sent?chip('Alterações não enviadas','warn',1):chip('Rascunho','',1))+'</div>';
    QK.forEach(q=>{
      h+='<div class="field"><div class="q">'+QS[q].label+'</div><div class="opts">';
      if(QS[q].multi)E.forEach(pid=>{h+='<label class="opt'+(open?'':' dis')+'"><input type="checkbox" data-ch="ans" data-a="'+a.id+'" data-q="'+q+'" data-v="'+pid+'"'+(d[q].includes(pid)?' checked':'')+(open?'':' disabled')+'>'+esc(nm(pid))+'</label>'});
      else USO.forEach(u=>{h+='<label class="opt'+(open?'':' dis')+'"><input type="radio" name="uso-'+a.id+'" data-ch="ans" data-a="'+a.id+'" data-q="uso" data-v="'+esc(u)+'"'+(d.uso===u?' checked':'')+(open?'':' disabled')+'>'+u+'</label>'});
      h+='</div>'+errm(a.id+':'+q)+'</div>';
    });
    if(d.contrib.includes(me))h+='<div class="field"><label for="ds-'+a.id+'">Descreva sua contribuição</label><textarea id="ds-'+a.id+'" data-in="ans" data-a="'+a.id+'" data-k="desc"'+(open?'':' disabled')+'>'+esc(d.desc)+'</textarea>'+errm(a.id+':desc')+'</div>';
    h+='<div class="field"><label for="lk-'+a.id+'">Link de evidência (opcional)</label><input type="text" id="lk-'+a.id+'" data-in="ans" data-a="'+a.id+'" data-k="link" placeholder="https://" value="'+esc(d.link)+'"'+(open?'':' disabled')+'>'+errm(a.id+':link')+'</div>';
    if(open)h+='<div class="muted" style="font-size:13px">Suas respostas ficarão visíveis para os '+E.length+' integrantes do projeto depois que a coleta for encerrada.</div><div class="row start">'+btn('send','Enviar respostas',{c:'pri',d:{aid:a.id}})+btn('draft','Salvar rascunho',{d:{aid:a.id}})+'</div>';
    h+='</div>';
  });
  h+='<div><button class="btn sm" data-act="otheredit">Testar permissão: editar respostas de outra pessoa</button></div>';
  return h;
}

/* ===== Coleta (HU-14, HU-26) ===== */
function vColeta(p){
  const org=p.org===ui.me,E=elig(p),as=approved(p);
  let h=head('Acompanhar a coleta','HU-14 HU-26','Ausência de resposta nunca conta como concordância.');
  h+='<div class="card"><div class="list">';
  p.members.forEach(m=>{
    if(m.status==='pendente')return;
    const sent=as.filter(a=>{const x=ansOf(p,m.pid,a.id);return x&&x.sent}).length;
    const isE=E.includes(m.pid);
    h+='<div class="li"><div class="l"><b>'+esc(nm(m.pid))+'</b><span class="muted" style="font-size:13px">'+(isE?sent+' de '+as.length+' ativos enviados':m.status==='naopart'?'Não participante':'Não elegível nesta rodada')+'</span></div><div class="row start">'+
    (!isE?chip('Fora da contagem','',1):sent===as.length&&as.length?chip('Enviado','ok',1):sent?chip('Parcial','warn',1):chip('Pendente','',1))+'</div></div>';
  });
  h+='</div></div>';
  const miss=E.filter(pid=>as.some(a=>{const x=ansOf(p,pid,a.id);return !(x&&x.sent)}));
  if(org&&p.phase==='coleta'){
    if(ui.flag.close){
      h+=banner(miss.length?miss.map(pid=>{const none=!as.some(a=>{const x=ansOf(p,pid,a.id);return x&&x.sent});return esc(nm(pid))+(none?' não respondeu.':' não respondeu a todos os ativos.')}).join(' ')+' As perguntas sem resposta ficarão pendentes.':'Todos os elegíveis responderam. Encerrar a coleta agora?','warn','<span class="row start">'+btn('closeok','Encerrar coleta',{c:'pri sm'})+btn('closeno','Cancelar',{c:'sm'})+'</span>');
    }else h+='<div>'+btn('closeask','Encerrar coleta',{c:'pri'})+'</div>';
    if(miss.length){
      h+='<div class="card"><h3>Lembrar quem ainda não respondeu</h3><div class="row start">'+miss.map(pid=>btn('remind','Enviar lembrete a '+esc(nm(pid)),{c:'sm',d:{pid}})).join('')+btn('remindgrp','Copiar mensagem para o grupo',{c:'sm'})+'</div>'+(ui.flag.grp?'<div class="tok">'+esc(ui.flag.grp)+'</div>':'')+'</div>';
    }
  }else if(p.phase!=='coleta')h+=banner('Coleta encerrada. As respostas já aparecem no mapa de divergências.','info',btn('go','Abrir o mapa',{c:'sm',d:{tab:'mapa'}}));
  return h;
}

/* ===== Mapa (HU-15 a HU-18) ===== */
function vMapa(p){
  let h=head('Mapa de divergências','HU-15 HU-16 HU-17 HU-18','Mostra onde a equipe concorda e onde precisa conversar.');
  if(p.phase==='coleta')return h+banner('O mapa fica disponível quando a coleta for encerrada.','info');
  const E=elig(p);
  if(!E.includes(ui.me)&&mem(p,ui.me)&&mem(p,ui.me).status!=='ativo')return h+naoElig();
  const items=allItems(p),c={conv:0,div:0,pend:0};items.forEach(i=>c[i.status]++);
  h+='<div class="counters">'+[['todos','Itens',items.length],['conv','Convergentes',c.conv],['div','Divergentes',c.div],['pend','Pendentes',c.pend]].map(x=>'<button class="cnt'+(ui.filter===x[0]?' on':'')+'" data-act="filter" data-f="'+x[0]+'"><b>'+x[2]+'</b><span>'+x[1]+'</span></button>').join('')+'</div>';
  h+='<div class="muted" style="font-size:13px">Convergentes + divergentes + pendentes = '+(c.conv+c.div+c.pend)+' de '+items.length+' itens.</div>';
  items.filter(i=>ui.filter==='todos'||i.status===ui.filter).forEach(i=>{
    const a=p.assets.find(x=>x.id===i.aid),op=ui.open===i.key,or=origin(p,i.aid,i.q);
    h+='<div class="item '+i.status+'"><div class="row"><div class="l"><b>'+esc(a.name)+' × '+QS[i.q].label+'</b>'+(or.length&&!op?'<span class="muted" style="font-size:13px">'+esc(or[0])+'</span>':'')+'</div><div class="row start">'+chip(ST[i.status][0],ST[i.status][1],1)+btn('open',op?'Fechar':'Abrir',{c:'sm',d:{key:i.key}})+'</div></div>';
    if(op){
      h+='<div class="cmp">'+E.map(pid=>{const an=ansOf(p,pid,i.aid),s=an&&an.sent;
        return '<div><b>'+esc(nm(pid))+'</b>'+(s?'<span>'+(QS[i.q].multi?(s[i.q].map(nm).join(', ')||'Ninguém'):esc(s[i.q]))+'</span>'+(i.q==='contrib'&&s.contrib.includes(pid)?'<span class="muted" style="font-size:13px">'+esc(s.desc)+'</span>'+(s.link?'<span class="mono">'+esc(s.link)+'</span>':'<span class="muted" style="font-size:13px">Sem link de evidência</span>'):''):'<span class="muted">'+esc(nm(pid))+' não respondeu</span>')+'</div>'}).join('')+'</div>';
      if(or.length)h+='<div>'+or.map(x=>'<div>• '+esc(x)+'</div>').join('')+'</div>';
      if(i.status==='div'){
        h+='<div><b style="font-size:14px">Cenários possíveis</b><div class="muted" style="font-size:13px">Textos fixos por tipo de pergunta. Nenhum é recomendado nem vem selecionado.</div></div><div class="cmp">'+SCEN[i.q].map(s=>'<div><b>'+esc(s[0])+'</b><span style="font-size:13px">'+esc(s[1])+'</span></div>').join('')+'</div>';
      }
    }
    h+='</div>';
  });
  if(p.org===ui.me&&p.phase==='encerrada')h+=banner('A equipe já viu as respostas. Quando a conversa terminar, abra a fase de decisão.','info',btn('startdec','Iniciar decisão',{c:'pri sm'}));
  return h;
}

/* ===== Decisão (HU-19 a HU-21) ===== */
function propOf(p,aid){return p.proposal[aid]=p.proposal[aid]||{titulares:[],uso:'',texto:'',semAcordo:false,saved:false}}
function vDecisao(p){
  const org=p.org===ui.me,E=elig(p),as=approved(p);
  let h=head('Proposta de decisão','HU-19 HU-20 HU-21','A organizadora redige. As demais pessoas comentam antes da confirmação.');
  if(p.phase==='coleta'||p.phase==='encerrada')return h+banner(p.phase==='coleta'?'A decisão começa depois do encerramento da coleta.':'Inicie a fase de decisão no mapa de divergências.','info');
  const edit=p.phase==='decisao'&&org;
  const lv=lastV(p);
  if(p.phase==='decisao'&&lv){
    const ref=Object.keys(lv.conf).filter(k=>lv.conf[k].v==='no');
    if(ref.length)h+=banner('A v'+lv.n+' voltou para decisão. '+ref.map(k=>esc(nm(k))+' recusou: "'+esc(lv.conf[k].comment)+'"').join(' '),'bad');
  }
  if(p.phase!=='decisao'){
    h+=banner('A proposta está '+(p.phase==='consolidado'?'consolidada':'em confirmação')+'. Editar o texto cria uma nova versão e invalida as confirmações da v'+(lv?lv.n:1)+'.','info',org&&p.phase==='confirmacao'?btn('editask','Editar proposta',{c:'sm'}):'');
    if(ui.flag.edit)h+=banner('Editar criará a v'+(lv.n+1)+' e invalidará as confirmações da v'+lv.n+'. A v'+lv.n+' continua disponível para consulta.','warn','<span class="row start">'+btn('editok','Continuar e editar',{c:'pri sm'})+btn('editno','Cancelar',{c:'sm'})+'</span>');
  }
  as.forEach(a=>{
    const pr=propOf(p,a.id);
    h+='<div class="card"><div class="row"><h3>'+esc(a.name)+' <span class="chip">'+esc(a.cat)+'</span></h3>'+(pr.semAcordo?chip('Sem acordo','bad',1):pr.saved?chip('Redigida por '+nm(pr.by)+' em '+fmt(pr.at),'ok',1):chip('Não redigida','',1))+'</div>';
    if(edit){
      h+='<div class="field"><div class="q">Titulares</div><div class="opts">'+E.map(pid=>'<label class="opt"><input type="checkbox" data-ch="prop" data-a="'+a.id+'" data-q="titulares" data-v="'+pid+'"'+(pr.titulares.includes(pid)?' checked':'')+'>'+esc(nm(pid))+'</label>').join('')+'</div></div>'+
      '<div class="field"><div class="q">Regra de uso depois da saída</div><div class="opts">'+USO.map(u=>'<label class="opt"><input type="radio" name="pu-'+a.id+'" data-ch="prop" data-a="'+a.id+'" data-q="uso" data-v="'+esc(u)+'"'+(pr.uso===u?' checked':'')+'>'+u+'</label>').join('')+'</div></div>'+
      '<div class="field"><label for="pt-'+a.id+'">Texto da decisão</label><textarea id="pt-'+a.id+'" data-in="prop" data-a="'+a.id+'" data-k="texto">'+esc(pr.texto)+'</textarea></div>'+
      '<label class="opt" style="align-self:flex-start"><input type="checkbox" data-ch="prop" data-a="'+a.id+'" data-q="sem"'+(pr.semAcordo?' checked':'')+'>Marcar titularidade como "Sem acordo"</label>'+errm('p'+a.id)+'<div>'+btn('saveprop','Salvar proposta deste ativo',{c:'pri sm',d:{aid:a.id}})+'</div>';
    }else{
      h+=pr.saved||pr.semAcordo?'<div class="cmp"><div><b>Titulares</b><span>'+(pr.semAcordo?'Sem acordo':esc(pr.titulares.map(nm).join(', ')))+'</span></div><div><b>Regra de uso</b><span>'+esc(pr.uso||'Não definida')+'</span></div><div><b>Texto</b><span>'+esc(pr.texto||'Sem texto')+'</span></div></div>':'<span class="muted">A organizadora ainda não redigiu este ativo.</span>';
      if(p.phase==='decisao'&&!org)h+='<div class="muted" style="font-size:13px">Apenas a organizadora altera a proposta. Você pode comentar.</div><div class="row start"><button class="btn sm" data-act="tryprop">Tentar alterar a proposta</button></div>';
    }
    const cs=p.comments.filter(c=>c.aid===a.id);
    h+='<div class="list">'+cs.map(c=>'<div class="li"><span><b>'+esc(nm(c.pid))+':</b> '+esc(c.text)+'</span><span class="mono muted">'+fmt(c.at)+'</span></div>').join('')+'</div>';
    if(E.includes(ui.me)&&(p.phase==='decisao'||p.phase==='confirmacao'))h+='<div class="field"><label for="cm-'+a.id+'">Comentar</label><input type="text" id="cm-'+a.id+'" data-in="cmt" data-a="'+a.id+'" value="'+esc(ui.cmt[a.id]||'')+'" placeholder="Escreva um comentário para a equipe"></div><div>'+btn('comment','Comentar',{c:'sm',d:{aid:a.id}})+'</div>';
    h+='</div>';
  });
  if(edit)h+=errm('send')+'<div>'+btn('sendv','Enviar para confirmação ('+'v'+(p.versions.length+1)+')',{c:'pri'})+'</div>';
  return h;
}

/* ===== Confirmação (HU-21 a HU-23) ===== */
function verCard(p,v,curr){
  const E=elig(p);
  let h='<div class="card"><div class="row"><h3>Versão v'+v.n+'</h3><div class="row start">'+(curr?chip('Versão atual','acc',1):chip('Versão antiga','',1))+'<span class="mono muted">'+fmt(v.at)+'</span></div></div>';
  h+='<div class="list">'+Object.keys(v.snap).map(aid=>{const s=v.snap[aid];return '<div class="li"><div class="l"><b>'+esc(s.name)+' <span class="chip">'+esc(s.cat)+'</span></b><span style="font-size:14px">'+(s.semAcordo?'Titularidade sem acordo':'Titulares: '+esc(s.titulares.map(nm).join(', '))+'. Uso: '+esc(s.uso)+'.')+'</span>'+(s.texto?'<span class="muted" style="font-size:13px">'+esc(s.texto)+'</span>':'')+'</div></div>'}).join('')+'</div>';
  h+='<div class="cmp">'+E.map(pid=>{const c=v.conf[pid];return '<div><b>'+esc(nm(pid))+'</b>'+(c?(c.v==='ok'?chip('Confirmou','ok',1):chip('Recusou','bad',1))+(c.comment?'<span style="font-size:13px">'+esc(c.comment)+'</span>':'')+'<span class="mono muted">'+fmt(c.at)+'</span>':chip('Pendente','',1))+'</div>'}).join('')+'</div>';
  if(!curr)h+='<div>'+btn('oldconf','Tentar confirmar esta versão',{c:'sm',d:{n:v.n}})+'</div>';
  return h+'</div>';
}
function vConf(p){
  let h=head('Confirmação','HU-21 HU-22 HU-23','Cada pessoa confirma ou recusa uma versão identificada.');
  const lv=lastV(p);
  if(!lv)return h+banner('Ainda não existe versão para confirmar. A organizadora envia a proposta na aba Decisão.','info');
  const E=elig(p),me=ui.me,c=lv.conf[me];
  if(p.phase==='consolidado')h+=banner('Todos os elegíveis confirmaram a v'+lv.n+'. O projeto está Consolidado.','info');
  const sem=Object.values(lv.snap).some(s=>s.semAcordo);
  if(p.phase==='confirmacao'&&E.every(x=>lv.conf[x]&&lv.conf[x].v==='ok')&&sem)h+=banner('Todos confirmaram, mas há item sem acordo. O projeto não pode ficar Consolidado.','warn',p.org===me?btn('editask','Voltar para decisão',{c:'sm'}):'');
  if(ui.flag.edit&&p.phase==='confirmacao')h+=banner('Editar criará a v'+(lv.n+1)+' e invalidará as confirmações da v'+lv.n+'.','warn','<span class="row start">'+btn('editok','Continuar e editar',{c:'pri sm'})+btn('editno','Cancelar',{c:'sm'})+'</span>');
  h+=verCard(p,lv,true);
  if(p.phase==='confirmacao'){
    if(!E.includes(me))h+=naoElig();
    else if(c)h+='<div class="muted">Você já se posicionou sobre a v'+lv.n+'.</div>';
    else h+='<div class="card"><h3>Seu posicionamento sobre a v'+lv.n+'</h3><div class="field"><label for="rf">Motivo (obrigatório para recusar)</label><textarea id="rf" data-in="refuse">'+esc(ui.refuse)+'</textarea>'+errm('refuse')+'</div><div class="row start">'+btn('conf','Confirmar v'+lv.n,{c:'pri',d:{n:lv.n}})+btn('refuse','Recusar',{c:'bad',d:{n:lv.n}})+'</div></div>';
  }
  if(p.versions.length>1)h+='<h3 style="margin-top:6px">Versões anteriores</h3>'+p.versions.slice(0,-1).reverse().map(v=>verCard(p,v,false)).join('');
  return h;
}

/* ===== Memorial (HU-24, HU-25) ===== */
function memorialBody(p,at){
  const v=lastV(p),cons=p.phase==='consolidado',L=[],E=elig(p);
  L.push('MEMORIAL DE DECISÕES');L.push('Projeto: '+p.name+' ('+(p.context||'sem contexto')+')');
  L.push('Estado: '+(cons?'Consolidado':'Não consolidado'));L.push('Versão da proposta: v'+v.n);L.push('Gerado em: '+fmt(at));L.push('');
  L.push('PESSOAS');
  p.members.forEach(m=>L.push('- '+nm(m.pid)+', '+roleTxt(p,m.pid).toLowerCase()+(m.status==='naopart'?' (Não participante)':m.status==='pendente'?' (Convite pendente)':!m.elig?' (não elegível nesta rodada)':'')));
  L.push('');L.push('ATIVOS, CONTRIBUIÇÕES E DECISÕES');
  approved(p).forEach(a=>{
    L.push('');L.push(a.name+' ('+a.cat+')');
    E.forEach(pid=>{const x=ansOf(p,pid,a.id),s=x&&x.sent;if(s&&s.contrib.includes(pid)){L.push('  Contribuição de '+nm(pid)+': '+s.desc);L.push('  Evidência: '+(s.link||'não informada'))}});
    const s=v.snap[a.id];
    if(s){L.push('  Decisão: '+(s.semAcordo?'SEM ACORDO na titularidade':'titulares '+s.titulares.map(nm).join(', ')+'; uso após a saída: '+s.uso));if(s.texto)L.push('  Texto: '+s.texto)}
  });
  L.push('');L.push('CONFIRMAÇÕES DA v'+v.n);
  E.forEach(pid=>{const c=v.conf[pid];L.push('- '+nm(pid)+': '+(c?(c.v==='ok'?'confirmou':'recusou ('+c.comment+')')+' em '+fmt(c.at):'ainda não se posicionou')) });
  const ref=[];p.versions.forEach(x=>Object.keys(x.conf).forEach(k=>{if(x.conf[k].v==='no')ref.push('- '+nm(k)+' recusou a v'+x.n+': '+x.conf[k].comment)}));
  if(ref.length){L.push('');L.push('RECUSAS REGISTRADAS');ref.forEach(r=>L.push(r))}
  const sem=Object.keys(v.snap).filter(k=>v.snap[k].semAcordo).map(k=>v.snap[k].name);
  if(sem.length){L.push('');L.push('ITENS SEM ACORDO');sem.forEach(s=>L.push('- '+s+', titularidade'))}
  L.push('');L.push(LIMITS);
  return L.join('\n');
}
function vMemorial(p){
  let h=head('Memorial','HU-24 HU-25','O documento reúne só os dados deste projeto.');
  if(!lastV(p))return h+banner('O memorial fica disponível depois do envio da primeira versão para confirmação.','info');
  const ms=p.memorials;
  h+='<div class="card"><div class="row"><h3>Memorial de '+esc(p.name)+'</h3>'+chip(p.phase==='consolidado'?'Consolidado':'Não consolidado',p.phase==='consolidado'?'ok':'warn',1)+'</div><div class="muted" style="font-size:13px">Este protótipo mostra o memorial na tela. No produto, ele sai como PDF.</div><div>'+btn('genmem','Gerar memorial agora',{c:'pri'})+'</div></div>';
  if(ms.length){
    const m=ms[0];
    h+='<div class="paper">'+esc(m.body)+'\n\nCódigo de verificação (SHA-256): '+m.hash+'</div><div class="row start">'+btn('copymem','Copiar texto do memorial',{c:'sm'})+'<span class="muted" style="font-size:13px">'+ms.length+' memorial'+(ms.length>1?'is':'')+' gerado'+(ms.length>1?'s':'')+' neste projeto</span></div>';
  }
  h+='<div class="card"><h3>Verificar integridade</h3><div class="muted" style="font-size:13px">Cole o texto do memorial. A MIP confere o código com os memoriais que gerou.</div><textarea id="vt" data-in="vtext" style="min-height:110px">'+esc(ui.verifyText)+'</textarea><div class="row start">'+btn('verify','Verificar',{c:'pri sm'})+(ms.length?btn('pasteorig','Colar o original',{c:'sm'})+btn('pastealt','Colar uma versão alterada',{c:'sm'}):'')+'</div>'+(ui.verify?banner(esc(ui.verify.msg),ui.verify.ok?'info':'bad'):'')+'</div>';
  return h;
}

/* ===== Geral ===== */
function header(){
  const mine=projects.filter(x=>mem(x,ui.me)&&mem(x,ui.me).status!=='pendente');
  return '<div class="top"><div class="brand"><b>MIP</b><span>Backstage · protótipo V1</span></div><div class="ctrls">'+
   '<label>Ver como<select id="who" data-ch="who">'+Object.keys(people).map(k=>'<option value="'+k+'"'+(ui.me===k?' selected':'')+'>'+esc(people[k].name)+(k==='diego'?' (de fora)':k==='ana'?' (organizadora)':'')+'</option>').join('')+'</select></label>'+
   '<label>Projeto<select id="proj" data-ch="proj">'+(mine.some(x=>x.id===ui.pid)?'':'<option value="'+ui.pid+'" selected>Endereço aberto</option>')+mine.map(x=>'<option value="'+x.id+'"'+(ui.pid===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label>'+
   '<button class="btn sm" data-act="go" data-tab="novo">Novo projeto</button></div></div>';
}
function render(){
  const p=cur(),m=mem(p,ui.me);let h=header();
  if(ui.tab==='novo'){h+=vNovo();$('#app').innerHTML=h+demo();return}
  if(!m){
    h+='<div class="card"><h2>Você não tem acesso a este projeto</h2><p class="muted">Endereço aberto: mip.app/p/'+esc(p.id)+'. Nenhum dado do projeto é exibido.</p><div class="row start">'+btn('openlink','Abrir link de convite',{c:'pri sm',d:{who:ui.me}})+(projects.some(x=>mem(x,ui.me))?btn('mine','Ir para meus projetos',{c:'sm'}):'')+'</div>'+errm('link')+'</div>';
  }else if(m.status==='pendente'){
    h+='<div class="card"><h2>Você foi convidado para '+esc(p.name)+'</h2><p class="muted">Aceite o convite para ver o projeto e o estado da coleta. As respostas de outras pessoas ficam ocultas.</p><div>'+btn('accept','Aceitar convite',{c:'pri',d:{pid:ui.me}})+'</div></div>';
  }else{
    const ix=PH.indexOf(p.phase);
    h+='<div class="phases">'+PH.map((k,i)=>'<div class="ph'+(i<ix?' done':'')+(i===ix?' now':'')+'"><i></i>'+PHN[k]+'</div>').join('')+'</div>';
    const T=[['equipe','Equipe'],['ativos','Ativos'],['resp','Respostas'],['coleta','Coleta'],['mapa','Mapa'],['decisao','Decisão'],['conf','Confirmação'],['memorial','Memorial']];
    h+='<div class="tabs" role="tablist">'+T.map(t=>'<button class="tab'+(ui.tab===t[0]?' on':'')+'" role="tab" data-act="go" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div class="sec">';
    h+=({equipe:vEquipe,ativos:vAtivos,resp:vResp,coleta:vColeta,mapa:vMapa,decisao:vDecisao,conf:vConf,memorial:vMemorial}[ui.tab]||vEquipe)(p);
    h+='</div>';
  }
  $('#app').innerHTML=h+demo();
}

function demo(){
  return '<details class="demo"><summary>Roteiro e atalhos da demonstração</summary><ol><li>Equipe: convide, marque alguém como não participante, teste o link como Diego.</li><li>Ativos: sugira como Bruno e aprove como Ana.</li><li>Respostas: entre como Carla e envie as respostas pendentes.</li><li>Coleta: encerre como Ana e veja o aviso de pendências.</li><li>Mapa: abra os itens divergentes e leia os cenários.</li><li>Decisão: redija como Ana e envie a v1.</li><li>Confirmação: Carla recusa, Ana reenvia a v2, todos confirmam.</li><li>Memorial: gere e verifique o código.</li></ol><div class="row start" style="margin-top:10px">'+btn('demo-fill','Preencher respostas de exemplo',{c:'sm'})+btn('demo-skip','Pular para a fase de decisão',{c:'sm'})+btn('demo-reset','Reiniciar demonstração',{c:'sm bad'})+'</div></details>';
}

/* ===== Ações ===== */
function act(a,d){
  const p=cur(),me=ui.me;ui.err={};
  switch(a){
  case 'go':ui.tab=d.tab;ui.flag={};break;
  case 'mine':ui.pid=projects.find(x=>mem(x,me)).id;ui.tab='equipe';break;
  case 'ack':p.ack[me]=true;break;
  case 'filter':ui.filter=d.f;break;
  case 'open':ui.open=ui.open===d.key?null:d.key;break;
  case 'invite':{
    const e=ui.inv.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(e)){ui.err.inv='Informe um e-mail válido';break}
    let pid=Object.keys(people).find(k=>people[k].email===e);
    if(pid&&mem(p,pid)){ui.err.inv='Esta pessoa já faz parte do projeto';break}
    if(!pid){pid=e.split('@')[0].replace(/[^a-z0-9]/g,'')||rid();const nmx=pid.charAt(0).toUpperCase()+pid.slice(1);people[pid]={name:nmx,g:'m',email:e}}
    p.members.push({pid,status:'pendente',elig:true});log(p,me,'convidou '+e);ui.flag.invited=nm(pid)+' aparece como "Convite pendente". Um e-mail com o link de acesso foi enviado.';ui.inv='';break}
  case 'accept':{const m=mem(p,d.pid);m.status='ativo';m.elig=p.phase==='coleta';log(p,d.pid,'aceitou o convite'+(m.elig?'':' depois do encerramento da coleta e não é elegível nesta rodada'));say(nm(d.pid)+' agora está Ativo.');break}
  case 'toglink':p.link.active=!p.link.active;log(p,me,p.link.active?'ativou o link de convite':'desativou o link de convite');break;
  case 'openlink':{
    if(!p.link.active){ui.err.link='Este convite não está mais ativo';break}
    const who=d.who;if(mem(p,who)){ui.me=who;ui.tab='equipe';say(nm(who)+' já é integrante. Nenhum integrante duplicado foi criado.');break}
    p.members.push({pid:who,status:'ativo',elig:p.phase==='coleta'});log(p,who,'entrou pelo link de convite');ui.me=who;ui.tab='equipe';say(nm(who)+' entrou no projeto como Ativo'+(p.phase==='coleta'?'.':', mas não é elegível nesta rodada.'));break}
  case 'naopart':{
    if(d.pid===p.org){ui.err.np='A organizadora não pode ser marcada como não participante';break}
    const m=mem(p,d.pid);m.status='naopart';m.by=me;m.at=Date.now();
    Object.values(p.proposal).forEach(pr=>{pr.titulares=pr.titulares.filter(x=>x!==d.pid)});
    log(p,me,'marcou '+nm(d.pid)+' como não participante');break}
  case 'addasset':{
    const f=ui.addA;if(!f.name.trim()){ui.err.fn='Informe o nome do ativo';break}if(!f.cat){ui.err.fc='Escolha uma categoria';break}
    p.assets.push({id:'a'+rid(),name:f.name.trim(),cat:f.cat,desc:f.desc.trim(),st:'ok'});log(p,me,'cadastrou o ativo '+f.name.trim());ui.addA={name:'',cat:'',desc:''};say('Ativo cadastrado. Ele já aparece no questionário de todos.');break}
  case 'sugasset':{
    const f=ui.sug;if(p.phase!=='coleta'){ui.err.fn='A coleta já foi encerrada';break}
    if(!f.name.trim()){ui.err.fn='Informe o nome do ativo';break}if(!f.cat){ui.err.fc='Escolha uma categoria';break}
    p.assets.push({id:'a'+rid(),name:f.name.trim(),cat:f.cat,desc:f.desc.trim(),st:'sug',by:me});log(p,me,'sugeriu o ativo '+f.name.trim());ui.sug={name:'',cat:'',desc:''};say('Sugestão enviada para '+nm(p.org)+'.');break}
  case 'aprov':{const x=p.assets.find(y=>y.id===d.aid);x.st='ok';log(p,me,'aprovou o ativo '+x.name);break}
  case 'recus':{const x=p.assets.find(y=>y.id===d.aid);x.st='rec';x.reason=(ui.refSug[d.aid]||'').trim()||'Sem motivo informado';log(p,me,'recusou o ativo '+x.name);break}
  case 'del':{
    if(p.phase!=='coleta'){ui.err['d'+d.aid]='Ativos não podem ser excluídos depois do encerramento da coleta';break}
    const n=p.members.filter(m=>ansOf(p,m.pid,d.aid)&&ansOf(p,m.pid,d.aid).sent).length;
    if(n===0)delAsset(p,d.aid);else ui.flag.del=d.aid;break}
  case 'delok':delAsset(p,d.aid);ui.flag={};break;
  case 'delno':ui.flag={};break;
  case 'draft':say('Rascunho salvo. Você pode voltar depois e continuar.');break;
  case 'send':sendAnswer(p,d.aid);break;
  case 'tryedit':say('Ação bloqueada: a coleta foi encerrada.','bad');break;
  case 'otheredit':say('Ação negada: você só pode alterar as suas próprias respostas.','bad');break;
  case 'closeask':ui.flag.close=true;break;
  case 'closeno':ui.flag={};break;
  case 'closeok':p.phase='encerrada';log(p,me,'encerrou a coleta');ui.flag={};ui.tab='mapa';say('Coleta encerrada. O mapa de divergências está aberto.');break;
  case 'remind':say('Lembrete enviado por e-mail para '+nm(d.pid)+'. O e-mail traz só o link do projeto.');break;
  case 'remindgrp':{const E=elig(p),as=approved(p);const miss=E.filter(pid=>as.some(a=>{const x=ansOf(p,pid,a.id);return !(x&&x.sent)})).map(nm);ui.flag.grp='Pessoal, faltam respostas na MIP: '+miss.join(', ')+'. Acesse mip.app/p/'+p.id;copy(ui.flag.grp);break}
  case 'startdec':p.phase='decisao';log(p,me,'iniciou a fase de decisão');ui.tab='decisao';break;
  case 'saveprop':{
    const pr=propOf(p,d.aid);
    if(!pr.semAcordo&&(!pr.titulares.length||!pr.uso||!pr.texto.trim())){ui.err['p'+d.aid]='Defina titulares, regra de uso e texto da decisão, ou marque "Sem acordo".';break}
    pr.saved=true;pr.by=me;pr.at=Date.now();log(p,me,'registrou a proposta de '+p.assets.find(x=>x.id===d.aid).name);say(pr.semAcordo?'Item registrado como sem acordo. O projeto não poderá ficar Consolidado enquanto ele valer.':'Proposta salva.');break}
  case 'tryprop':say('Ação negada: só a organizadora altera a proposta. Use o comentário.','bad');break;
  case 'comment':{const t=(ui.cmt[d.aid]||'').trim();if(!t){say('Escreva o comentário antes de enviar.','bad');break}p.comments.push({aid:d.aid,pid:me,text:t,at:Date.now()});ui.cmt[d.aid]='';say('Comentário registrado. A proposta não foi alterada.');break}
  case 'sendv':{
    const as=approved(p);if(as.some(a=>!(propOf(p,a.id).saved||propOf(p,a.id).semAcordo&&propOf(p,a.id).saved))){ui.err.send='Conclua a proposta de todos os ativos antes de enviar.';break}
    const snap={};as.forEach(a=>{const pr=p.proposal[a.id];snap[a.id]={name:a.name,cat:a.cat,titulares:clone(pr.titulares),uso:pr.uso,texto:pr.texto,semAcordo:pr.semAcordo}});
    const n=p.versions.length+1;p.versions.push({n,at:Date.now(),snap,conf:{}});p.phase='confirmacao';log(p,me,'enviou a v'+n+' para confirmação');ui.tab='conf';say('Versão v'+n+' criada. O projeto está Em confirmação.');break}
  case 'editask':ui.flag.edit=true;break;
  case 'editno':ui.flag={};break;
  case 'editok':{p.phase='decisao';ui.flag={};log(p,me,'reabriu a proposta; o próximo envio criará a v'+(p.versions.length+1));ui.tab='decisao';break}
  case 'oldconf':{const lv=lastV(p);say('Ação negada: a versão atual é a v'+lv.n+'. Você foi levado a ela.','bad');break}
  case 'conf':case 'refuse':{
    const lv=lastV(p);if(+d.n!==lv.n||p.phase!=='confirmacao'){say('Ação negada: só é possível se posicionar sobre a versão atual.','bad');break}
    if(!elig(p).includes(me)){say('Você não é elegível para confirmar nesta rodada.','bad');break}
    if(a==='refuse'){
      if(!ui.refuse.trim()){ui.err.refuse='Explique o motivo da recusa';break}
      lv.conf[me]={v:'no',comment:ui.refuse.trim(),at:Date.now()};p.phase='decisao';ui.refuse='';log(p,me,'recusou a v'+lv.n);say('Recusa registrada. O projeto voltou para Em decisão.');break}
    lv.conf[me]={v:'ok',comment:'',at:Date.now()};log(p,me,'confirmou a v'+lv.n);
    if(elig(p).every(x=>lv.conf[x]&&lv.conf[x].v==='ok')&&!Object.values(lv.snap).some(s=>s.semAcordo)){p.phase='consolidado';say('Todos confirmaram a v'+lv.n+'. O projeto está Consolidado.')}else say('Confirmação registrada.');break}
  case 'genmem':genMem(p);return;
  case 'copymem':copy(p.memorials[0].body+'\n\nCódigo de verificação (SHA-256): '+p.memorials[0].hash);return;
  case 'pasteorig':ui.verifyText=p.memorials[0].body+'\n\nCódigo de verificação (SHA-256): '+p.memorials[0].hash;ui.verify=null;break;
  case 'pastealt':ui.verifyText=(p.memorials[0].body+'\n\nCódigo de verificação (SHA-256): '+p.memorials[0].hash).replace('Estado: ','Estado: (alterado) ');ui.verify=null;break;
  case 'verify':doVerify();return;
  case 'mkproj':{
    if(!ui.novo.name.trim()){ui.err.pn='Informe o nome do projeto';break}
    const q=mkProject('p'+rid(),ui.novo.name.trim(),ui.novo.ctx.trim(),me);log(q,me,'criou o projeto '+q.name);projects.push(q);ui.pid=q.id;ui.tab='equipe';ui.novo={name:'',ctx:''};say('Projeto criado. Você é a organizadora.');break}
  case 'demo-fill':fillDemo(p);say('Respostas de exemplo preenchidas. Carla ainda não enviou o Backend.');break;
  case 'demo-skip':{if(p.phase==='coleta'){fillDemo(p);p.phase='decisao';log(p,'sistema','abriu a fase de decisão para a demonstração')}ui.tab='decisao';say('Projeto na fase de decisão.');break}
  case 'demo-reset':seed();say('Demonstração reiniciada.');break;
  }
  render();
}
function delAsset(p,aid){const x=p.assets.find(y=>y.id===aid);p.assets=p.assets.filter(y=>y.id!==aid);Object.values(p.answers).forEach(o=>delete o[aid]);delete p.proposal[aid];log(p,ui.me,'excluiu o ativo '+x.name+' e descartou as respostas');say('Ativo excluído e registrado no histórico.')}
function sendAnswer(p,aid){
  const me=ui.me,an=ensureAns(p,me,aid),d=an.draft,E=elig(p);
  d.contrib=d.contrib.filter(x=>E.includes(x));d.titular=d.titular.filter(x=>E.includes(x));
  let bad=false;
  QK.forEach(q=>{if(QS[q].multi?!d[q].length:!d[q]){ui.err[aid+':'+q]='Responda esta pergunta para enviar';bad=true}});
  if(d.contrib.includes(me)&&!d.desc.trim()){ui.err[aid+':desc']='Descreva sua contribuição';bad=true}
  if(d.link.trim()&&!/^https?:\/\/\S+$/i.test(d.link.trim())){ui.err[aid+':link']='Informe um link válido, começando com http';bad=true}
  if(bad){say('Revise os campos destacados para enviar.','bad');return}
  const had=!!an.sent;d.link=d.link.trim();an.sent=Object.assign(clone(d),{at:Date.now()});
  log(p,me,(had?'alterou':'enviou')+' as respostas de '+p.assets.find(x=>x.id===aid).name);
  say('Respostas de '+p.assets.find(x=>x.id===aid).name+' registradas em '+fmt(an.sent.at)+'.');
}
async function genMem(p){const at=Date.now(),body=memorialBody(p,at),hash=await sha(body);p.memorials.unshift({at,body,hash});log(p,ui.me,'gerou o memorial');say('Memorial gerado com código de verificação.');render()}
async function doVerify(){
  const t=ui.verifyText.replace(/\n*Código de verificação \(SHA-256\):.*$/s,'');
  if(!ui.verifyText.trim()){ui.verify={ok:false,msg:'Cole o texto do memorial para verificar.'};render();return}
  const h=await sha(t);let f=null;projects.forEach(p=>p.memorials.forEach(m=>{if(m.hash===h)f=m}));
  ui.verify=f?{ok:true,msg:'Este arquivo corresponde ao memorial gerado em '+fmt(f.at)}:{ok:false,msg:'Este arquivo não corresponde a nenhum memorial gerado pela MIP'};render();
}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset)});
document.addEventListener('input',e=>{
  const t=e.target,x=t.dataset;if(!x.in)return;const p=cur();
  if(x.in==='inv')ui.inv=t.value;
  else if(x.in==='refuse')ui.refuse=t.value;
  else if(x.in==='vtext')ui.verifyText=t.value;
  else if(x.in==='refsug')ui.refSug[x.a]=t.value;
  else if(x.in==='cmt')ui.cmt[x.a]=t.value;
  else if(x.in==='novo')ui.novo[x.k]=t.value;
  else if(x.in==='addA'||x.in==='sug')ui[x.in][x.k]=t.value;
  else if(x.in==='ans'){ensureAns(p,ui.me,x.a).draft[x.k]=t.value}
  else if(x.in==='prop'){const pr=propOf(p,x.a);pr[x.k]=t.value;pr.saved=false}
});
document.addEventListener('change',e=>{
  const t=e.target,x=t.dataset;if(!x.ch)return;const p=cur();
  if(x.ch==='who'){ui.me=t.value;ui.err={};ui.flag={};ui.refuse='';if(ui.tab==='novo')ui.tab='equipe'}
  else if(x.ch==='proj'){ui.pid=t.value;ui.err={};ui.flag={};ui.open=null;ui.tab='equipe'}
  else if(x.ch==='ans'){const d=ensureAns(p,ui.me,x.a).draft;ui.err={};if(x.q==='uso')d.uso=x.v;else{const i=d[x.q].indexOf(x.v);i<0?d[x.q].push(x.v):d[x.q].splice(i,1)}}
