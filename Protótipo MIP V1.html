<script>
/* ===== Constantes ===== */
const QS={contrib:{label:'Quem contribuiu?',multi:true,tag:'contribuinte'},titular:{label:'Quem deve ser titular?',multi:true,tag:'titular'},uso:{label:'Quem pode continuar usando o ativo se sair do projeto?',multi:false}};
const QK=['contrib','titular','uso'];
const USO=['Todos','Só os titulares','Ninguém sem acordo'];
const CATS=['Código','Marca','Design','Conteúdo','Protótipo','Outro'];
const PH=['coleta','encerrada','decisao','confirmacao','consolidado'];
const PHN={coleta:'Coleta aberta',encerrada:'Coleta encerrada',decisao:'Proposta em preparo',confirmacao:'Em confirmação',consolidado:'Consolidado'};
const ST={conv:['Respostas iguais','ok'],div:['Respostas diferentes','warn'],pend:['Sem resposta','']};
const SCEN={
 contrib:[['Lista de contribuições como declarada','Cada pessoa mantém o que informou e a equipe registra as descrições lado a lado.'],['Lista ajustada pela equipe','As pessoas conversam, olham as evidências e combinam uma lista única de quem contribuiu.']],
 titular:[['Titularidade de quem contribuiu','Todas as pessoas que contribuíram passam a ser titulares.'],['Titulares escolhidos pela equipe','A equipe define os titulares mesmo que não coincidam com quem contribuiu e registra o motivo.'],['Titularidade em aberto','O item é marcado como sem acordo e o projeto não fica Consolidado enquanto isso valer.']],
 uso:[['Todos continuam usando','Qualquer integrante pode usar o ativo depois de sair do projeto.'],['Só os titulares continuam usando','Quem sai sem ser titular deixa de usar o ativo.'],['Ninguém usa sem novo acordo','Depois da saída, qualquer uso exige um novo acordo da equipe.']]
};
const LIMITS='Este memorial é um registro preparatório das decisões da equipe. Ele não substitui contrato, advogado ou registro oficial.';

/* ===== Estado ===== */
let people,projects,ui,tt;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>Math.random().toString(36).slice(2,7);
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(', ',' às ');
const cur=()=>projects.find(x=>x.id===ui.pid);
const nm=pid=>people[pid]?people[pid].name:pid;
const mem=(p,pid)=>p.members.find(m=>m.pid===pid);
const elig=p=>p.members.filter(m=>m.status==='ativo'&&m.elig).map(m=>m.pid);
const approved=p=>p.assets.filter(a=>a.st==='ok');
const ansOf=(p,pid,aid)=>p.answers[pid]&&p.answers[pid][aid];
const log=(p,who,text)=>p.history.unshift({at:Date.now(),who,text});
const lastV=p=>p.versions[p.versions.length-1];
const STORAGE='mip-backstage-v1-onboarding';
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({people,projects,ui:{me:ui.me,pid:ui.pid,tab:ui.tab,tips:ui.tips,welcome:ui.welcome,introSeen:ui.introSeen,questionIntro:ui.questionIntro,qasset:ui.qasset,qstep:ui.qstep,theme:ui.theme}}))}catch(e){}}
function restore(){try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved&&saved.people&&Array.isArray(saved.projects)){people=saved.people;projects=saved.projects;Object.assign(ui,saved.ui||{});ui.tab=ui.tab==='home'||ui.tab==='novo'?'home':taskFor(cur(),ui.me).tab;if(ui.tab==='resp')focusQuestion(cur(),ui.me)}}catch(e){}}
function say(t,kind){const el=$('#toast');el.innerHTML='<div class="'+(kind||'')+'">'+esc(t)+'</div>';clearTimeout(tt);tt=setTimeout(()=>{el.innerHTML=''},4500)}
async function copy(t){try{await navigator.clipboard.writeText(t);say('Texto copiado.')}catch(e){say('Não foi possível copiar. Selecione o texto e copie manualmente.','bad')}}
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return ((h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')).repeat(4)}}

function mkProject(id,name,context,org){return{id,name,context,org,setupStep:'equipe',phase:'coleta',members:[{pid:org,status:'ativo',elig:true}],link:{active:true,code:rid()},assets:[],answers:{},proposal:{},comments:[],versions:[],history:[],memorials:[],ack:{}}}
function sendAns(p,pid,aid,f,at){p.answers[pid]=p.answers[pid]||{};p.answers[pid][aid]={draft:clone(f),sent:Object.assign(clone(f),{at:at||Date.now()})}}

function seed(){
  people={self:{name:'Você',g:'',email:''}};
  projects=[];
  ui={me:'self',pid:null,tab:'home',filter:'todos',open:null,err:{},flag:{},verifyText:'',verify:null,refuse:'',cmt:{},novo:{person:'',name:'',ctx:''},inv:'',sug:{name:'',cat:'',desc:''},addA:{name:'',cat:'',desc:''},refSug:{},introSeen:false,questionIntro:{},tips:{},welcome:{},qstep:0,qasset:null,theme:null};
}
function seedDemo(){
  people={ana:{name:'Ana',g:'f',email:'ana@email.com'},bruno:{name:'Bruno',g:'m',email:'bruno@email.com'},carla:{name:'Carla',g:'f',email:'carla@email.com'},diego:{name:'Diego',g:'m',email:'diego@email.com'}};
  const p=mkProject('p1','App Rotas','Projeto da disciplina','ana');
  p.members.push({pid:'bruno',status:'ativo',elig:true},{pid:'carla',status:'ativo',elig:true});
  p.assets=[{id:'a1',name:'Logo',cat:'Marca',desc:'Logotipo do app',st:'ok'},{id:'a2',name:'Backend',cat:'Código',desc:'API e servidor de rotas',st:'ok'}];
  sendAns(p,'ana','a1',{contrib:['ana','carla'],titular:['ana','bruno'],uso:'Todos',desc:'Defini o conceito e a paleta do logotipo',link:''});
  sendAns(p,'ana','a2',{contrib:['ana','bruno'],titular:['ana','bruno'],uso:'Todos',desc:'Desenhei a arquitetura e o banco de dados',link:'https://github.com/app-rotas/backend'});
  sendAns(p,'bruno','a1',{contrib:['ana','carla'],titular:['ana','bruno','carla'],uso:'Só os titulares',desc:'',link:''});
  p.answers.bruno.a2={draft:{contrib:['bruno'],titular:[],uso:'',desc:'Criei a API de rotas',link:''},sent:null};
  log(p,'ana','criou o projeto App Rotas');
  const q=mkProject('p2','Jogo X','Game jam de 48 horas','ana');
  q.members.push({pid:'bruno',status:'ativo',elig:true});
  q.assets=[{id:'x1',name:'Trilha sonora',cat:'Conteúdo',desc:'Faixas originais do jogo',st:'ok'}];
  sendAns(q,'ana','x1',{contrib:['ana'],titular:['ana'],uso:'Só os titulares',desc:'Compus as três faixas',link:''});
  log(q,'ana','criou o projeto Jogo X');
  p.setupStep='resp';q.setupStep='resp';projects=[p,q];
  ui={me:'ana',pid:'p1',tab:'home',filter:'todos',open:null,err:{},flag:{},verifyText:'',verify:null,refuse:'',cmt:{},novo:{name:'',ctx:''},inv:'',sug:{name:'',cat:'',desc:''},addA:{name:'',cat:'',desc:''},refSug:{},introSeen:false,questionIntro:{},tips:{},welcome:{},qstep:0,qasset:null,theme:null};
}
function fillDemo(p){
  sendAns(p,'bruno','a1',{contrib:['ana','carla'],titular:['ana','bruno','carla'],uso:'Só os titulares',desc:'',link:''});
  sendAns(p,'bruno','a2',{contrib:['bruno'],titular:['ana','bruno'],uso:'Todos',desc:'Criei a API de rotas',link:'https://github.com/app-rotas/backend/tree/api'});
  sendAns(p,'carla','a1',{contrib:['ana','carla'],titular:['ana','bruno'],uso:'Todos',desc:'Fiz as versões finais do logo',link:'https://figma.com/file/logo-app-rotas'});
  log(p,'sistema','respostas de exemplo preenchidas para a demonstração');
}

/* ===== Regras (HU-15) ===== */
const norm=(v,q)=>QS[q].multi?[...v].sort().join('|'):v;
function itemStatus(p,aid,q){
  const E=elig(p),vals=[];
  E.forEach(pid=>{const a=ansOf(p,pid,aid);if(a&&a.sent)vals.push({pid,v:a.sent[q]})});
  const set=new Set(vals.map(x=>norm(x.v,q)));
  const status=set.size>1?'div':(vals.length===0||vals.length<E.length?'pend':'conv');
  return{status,vals,missing:E.filter(pid=>!vals.find(x=>x.pid===pid))};
}
function origin(p,aid,q){
  if(!QS[q].multi)return[];
  const r=itemStatus(p,aid,q);if(r.status!=='div')return[];
  const all=new Set();r.vals.forEach(x=>x.v.forEach(i=>all.add(i)));
  const out=[];
  all.forEach(pid=>{
    const by=r.vals.filter(x=>x.v.includes(pid)).map(x=>x.pid),not=r.vals.filter(x=>!x.v.includes(pid)).map(x=>x.pid);
    if(not.length===0)return;
    const g=people[pid].g==='f'?'incluída':'incluído';
    out.push(by.length===1?nm(pid)+' foi '+g+' como '+QS[q].tag+' só por '+nm(by[0]):nm(pid)+' foi '+g+' como '+QS[q].tag+' por '+by.map(nm).join(' e ')+', mas não por '+not.map(nm).join(' e '));
  });
  return out;
}
function allItems(p){const o=[];approved(p).forEach(a=>QK.forEach(q=>o.push({aid:a.id,q,key:a.id+':'+q,...itemStatus(p,a.id,q)})));return o}

/* ===== Peças de UI ===== */
const chip=(t,c,dot)=>'<span class="chip '+(c||'')+'">'+(dot?'<i></i>':'')+esc(t)+'</span>';
const hu=s=>'<div class="hus">'+s.split(' ').map(x=>'<span class="hu">'+x+'</span>').join('')+'</div>';
const head=(t,hs,sub)=>'<div class="head"><h2>'+esc(t)+'</h2>'+(sub?'<p class="muted">'+sub+'</p>':'')+'</div>';
const banner=(t,k,btn)=>'<div class="banner '+(k||'')+'"><span>'+t+'</span>'+(btn||'')+'</div>';
const btn=(act,label,o)=>{o=o||{};return '<button class="btn '+(o.c||'')+'" data-act="'+act+'"'+Object.keys(o.d||{}).map(k=>' data-'+k+'="'+esc(o.d[k])+'"').join('')+(o.dis?' disabled':'')+'>'+label+'</button>'};
const errm=k=>ui.err[k]?'<div class="err" role="alert">'+esc(ui.err[k])+'</div>':'';
const naoElig=()=>banner('Você não participa desta coleta: entrou depois que ela foi encerrada ou está fora dela.','info');
const catChip=c=>c?' <span class="chip">'+esc(c)+'</span>':'';
const histUI=p=>'<details class="more"><summary>Histórico do projeto</summary><div class="list">'+(p.history.slice(0,8).map(x=>'<div class="li"><span>'+esc(x.who==='sistema'?'Sistema':nm(x.who))+' '+esc(x.text)+'</span><span class="mono muted">'+fmt(x.at)+'</span></div>').join('')||'<span class="muted">Sem registros.</span>')+'</div></details>';
const roleTxt=(p,pid)=>p.org===pid?'Quem organiza':'Integrante';
function memChip(m){return m.status==='ativo'?(m.elig?chip('Ativo','ok',1):chip('Entrou após a coleta','warn',1)):m.status==='pendente'?chip('Convite pendente','warn',1):chip('Fora da coleta','',1)}

/* ===== Equipe (HU-01 a HU-05, HU-13) ===== */
function vEquipe(p){
  const org=p.org===ui.me;
  let h=head('Equipe',  'HU-01 HU-02 HU-03 HU-04 HU-05 HU-13',esc(p.context||'Sem contexto'));

/* ===== Respostas (HU-10 a HU-13) ===== */
function ensureAns(p,pid,aid){p.answers[pid]=p.answers[pid]||{};return p.answers[pid][aid]=p.answers[pid][aid]||{draft:{contrib:[],titular:[],uso:'',desc:'',link:''},sent:null}}
function vResp(p){
  const me=ui.me,m=mem(p,me),as=approved(p),open=p.phase==='coleta';

  if(!as.length)return h+'<div class="card"><h3>Aguardando ativos</h3><p class="muted">Quem organiza ainda vai definir o que a equipe responderá. Você pode sugerir um ativo que ficou de fora.</p>'+btn('go','Ver ativos',{c:'pri',d:{tab:'ativos'}})+'</div>';
  const done=as.filter(a=>{const x=ansOf(p,me,a.id);return x&&x.sent}).length;

  if(ui.flag.qsent)h+=banner('Respostas enviadas para '+esc(p.assets.find(a=>a.id===ui.flag.qsent)?.name||'o ativo')+'. '+(done<as.length?'Continue com o próximo ativo.':'Sua parte nesta coleta terminou.'),'info');
  if(!ui.qasset||!as.some(a=>a.id===ui.qasset))return h+'<div class="home-grid">'+as.map((a,i)=>{const an=ensureAns(p,me,a.id);return '<div class="card home-project"><h3>'+esc(a.name)+'</h3><p class="muted">'+esc(a.desc||a.cat||'')+'</p>'+(an.sent?chip('Respostas enviadas','ok',1):chip('A responder','warn',1))+'<div>'+btn('qasset',an.sent?'Consultar respostas':'Responder sobre este ativo',{c:an.sent?'':'pri',d:{aid:a.id}})+'</div></div>'}).join('')+'</div>';
  const a=as.find(x=>x.id===ui.qasset),an=ensureAns(p,me,a.id),d=an.draft,s=Math.min(3,Math.max(0,ui.qstep)),q=QK[s],E=elig(p);
  h+='<div>'+btn('qlist','← Todos os ativos',{c:'sm'})+'</div><div class="card question-card"><div class="row"><div><h3>'+esc(a.name)+'</h3><span class="muted">'+esc(a.desc||a.cat||'')+'</span></div>'+(an.sent?chip('Enviado','ok',1):chip('Rascunho','warn',1))+'</div><div><span class="stage-note">Ativo '+(as.indexOf(a)+1)+' de '+as.length+' · '+(s===3?'Revisão antes do envio':'Pergunta '+(s+1)+' de 3')+'</span><div class="stepper">'+[0,1,2,3].map(i=>'<span class="'+(i<=s?'done':'')+'"></span>').join('')+'</div></div>';
  if(s<3){
    h+='<div><h3>'+esc(QS[q].label)+'</h3><p class="muted">'+(['Selecione as pessoas que participaram da criação deste ativo.','Escolha quem, na sua visão, deve ser titular deste ativo.','Pense no que deveria acontecer se alguém deixar o projeto.'][s])+'</p></div><div class="opts">';
    if(QS[q].multi)E.forEach(pid=>h+='<label class="opt'+(open?'':' dis')+'"><input type="checkbox" data-ch="ans" data-a="'+a.id+'" data-q="'+q+'" data-v="'+pid+'"'+(d[q].includes(pid)?' checked':'')+(open?'':' disabled')+'>'+esc(nm(pid))+'</label>');
    else USO.forEach(u=>h+='<label class="opt'+(open?'':' dis')+'"><input type="radio" name="uso-'+a.id+'" data-ch="ans" data-a="'+a.id+'" data-q="uso" data-v="'+esc(u)+'"'+(d.uso===u?' checked':'')+(open?'':' disabled')+'>'+esc(u)+'</label>');
    h+='</div>'+errm(a.id+':'+q);
    if(s===0){h+=d.contrib.includes(me)?'<div class="field"><label for="ds">Como você contribuiu?</label><textarea id="ds" data-in="ans" data-a="'+a.id+'" data-k="desc"'+(open?'':' disabled')+'>'+esc(d.desc)+'</textarea>'+errm(a.id+':desc')+'</div>':'';h+='<div class="field"><label for="lk">Link de evidência (opcional)</label><input id="lk" type="text" data-in="ans" data-a="'+a.id+'" data-k="link" placeholder="https://" value="'+esc(d.link)+'"'+(open?'':' disabled')+'>'+errm(a.id+':link')+'</div>'}
  }else h+='<div><h3>Revise suas respostas</h3><p class="muted">Confira antes de enviar. Você poderá alterar as respostas enquanto a coleta estiver aberta.</p></div><div class="review-grid">'+QK.map(k=>'<div><b>'+esc(QS[k].label)+'</b>'+esc(QS[k].multi?d[k].map(nm).join(', ')||'Não respondida':d[k]||'Não respondida')+'</div>').join('')+(d.contrib.includes(me)?'<div><b>Sua contribuição</b>'+esc(d.desc||'Não descrita')+'</div>':'')+(d.link?'<div><b>Evidência</b>'+esc(d.link)+'</div>':'')+'</div>'+errm(a.id+':contrib')+errm(a.id+':titular')+errm(a.id+':uso')+errm(a.id+':desc')+errm(a.id+':link');
  h+='<div class="row start">'+(s?btn('qback','Voltar'):'')+(open?(s===3?btn('qsend','Enviar respostas',{c:'pri'}):btn('qnext','Continuar',{c:'pri'}))+'<span class="muted" style="font-size:var(--t-subhead)">Salvo automaticamente</span>':s<3?btn('qnext','Continuar'):btn('qlist','Concluir'))+'</div></div>';

function vColeta(p){
  const org=p.org===ui.me,E=elig(p),as=approved(p);

  h+='<div class="card"><div class="list">';
  p.members.forEach(m=>{
    if(m.status==='pendente')return;
    const sent=as.filter(a=>{const x=ansOf(p,m.pid,a.id);return x&&x.sent}).length;
    const isE=E.includes(m.pid);
    h+='<div class="li"><div class="l"><b>'+esc(nm(m.pid))+'</b><span class="muted" style="font-size:var(--t-footnote)">'+(isE?sent+' de '+as.length+' ativos enviados':m.status==='naopart'?'Fora da coleta':'Entrou após a coleta')+'</span></div><div class="row start">'+
    (!isE?chip('Fora da contagem','',1):sent===as.length&&as.length?chip('Enviado','ok',1):sent?chip('Parcial','warn',1):chip('Pendente','',1))+'</div></div>';
  });
  h+='</div></div>';
  const miss=E.filter(pid=>as.some(a=>{const x=ansOf(p,pid,a.id);return !(x&&x.sent)}));

    if(!as.length)h+=banner('Cadastre ao menos um ativo antes de encerrar a coleta.','warn',btn('go','Organizar ativos',{c:'sm',d:{tab:'ativos'}}));
    else if(ui.flag.close){
      h+=banner(miss.length?miss.map(pid=>{const none=!as.some(a=>{const x=ansOf(p,pid,a.id);return x&&x.sent});return esc(nm(pid))+(none?' não respondeu.':' não respondeu a todos os ativos.')}).join(' ')+' Essas ausências aparecerão como “Sem resposta” na Comparação, nunca como concordância. Depois de encerrar, ninguém poderá editar respostas.':'Todas as pessoas responderam. Encerrar a coleta agora?','warn','<span class="row start">'+btn('closeok','Encerrar coleta',{c:'pri sm'})+btn('closeno','Cancelar',{c:'sm'})+'</span>');
    }else if(as.length)h+='<div class="task-card"><h3>'+(miss.length?'Ainda faltam respostas':'A coleta está pronta para encerrar')+'</h3><p>'+(miss.length?'Você pode lembrar as pessoas pendentes ou encerrar mesmo assim, registrando as ausências.':'Todas as pessoas responderam sobre todos os ativos.')+'</p>'+btn('closeask','Encerrar coleta',{c:'pri'})+(miss.length?'<div class="q" style="margin-top:10px">Lembrar quem ainda não respondeu</div><div class="row start">'+miss.map(pid=>btn('remind','Enviar lembrete a '+esc(nm(pid)),{c:'sm',d:{pid}})).join('')+btn('remindgrp','Copiar mensagem para o grupo',{c:'sm'})+'</div>'+(ui.flag.grp?'<div class="tok">'+esc(ui.flag.grp)+'</div>':''):'')+'</div>';
  }else if(p.phase!=='coleta')h+=banner('Coleta encerrada. As respostas já podem ser comparadas.','info',btn('go','Comparar respostas',{c:'sm',d:{tab:'mapa'}}));
  return h;
}

        return '<div><b>'+esc(nm(pid))+'</b>'+(s?'<span>'+(QS[i.q].multi?(s[i.q].map(nm).join(', ')||'Ninguém'):esc(s[i.q]))+'</span>'+(i.q==='contrib'&&s.contrib.includes(pid)?'<span class="muted" style="font-size:var(--t-footnote)">'+esc(s.desc)+'</span>'+(s.link?'<span class="mono">'+esc(s.link)+'</span>':'<span class="muted" style="font-size:var(--t-footnote)">Sem link de evidência</span>'):''):'<span class="muted">'+esc(nm(pid))+' não respondeu</span>')+'</div>'}).join('')+'</div>';

/* ===== Decisão (HU-19 a HU-21) ===== */
function propOf(p,aid){return p.proposal[aid]=p.proposal[aid]||{titulares:[],uso:'',texto:'',semAcordo:false,saved:false}}
function vDecisao(p){
  const org=p.org===ui.me,E=elig(p),as=approved(p);
  let h=head('Proposta','HU-19 HU-20 HU-21','Com base no que a equipe comparou, registre uma proposta. Cada integrante confirma individualmente depois.');
  if(p.phase==='coleta'||p.phase==='encerrada')return h+banner(p.phase==='coleta'?'A proposta começa depois do encerramento da coleta.':'Quem organiza inicia a proposta a partir da etapa Comparação.','info');
  const edit=p.phase==='decisao'&&org;
  const focus=as.find(a=>a.id===ui.dasset)||as.find(a=>!propOf(p,a.id).saved)||as[0];
  if(as.length>1)h+='<div class="row start" role="group" aria-label="Ativos da proposta">'+as.map(a=>btn('dasset',esc(a.name)+(propOf(p,a.id).saved?' ✓':''),{c:'sm'+(focus&&focus.id===a.id?' pri':''),d:{aid:a.id}})).join('')+'</div>';
  if(edit&&as.length){const left=as.filter(a=>!propOf(p,a.id).saved).length;h+='<div class="task-card"><h3>'+(left?'Proposta em elaboração':'Proposta pronta para confirmação')+'</h3><p>'+(left?left+' ativo'+(left===1?' precisa':'s precisam')+' de uma proposta. Salve cada um antes de enviar.':'Revise os ativos e envie a versão para que cada pessoa confirme individualmente.')+'</p>'+(left?'':btn('sendv','Enviar proposta para confirmação',{c:'pri'}))+errm('send')+'</div>'}
  const lv=lastV(p);
  if(p.phase==='decisao'&&!org)h+=banner('Quem organiza está preparando uma proposta. Leia o que já foi registrado e deixe comentários; a confirmação será individual quando uma versão for enviada.','info');
  if(p.phase==='decisao'&&lv){
    const ref=Object.keys(lv.conf).filter(k=>lv.conf[k].v==='no');
    if(ref.length)h+=banner('A v'+lv.n+' voltou para ajustes. '+ref.map(k=>esc(nm(k))+' recusou: "'+esc(lv.conf[k].comment)+'"').join(' '),'bad');
  }
  if(p.phase!=='decisao'){
    h+=banner('A proposta está '+(p.phase==='consolidado'?'consolidada':'em confirmação')+'. Editar o texto cria uma nova versão e invalida as confirmações da v'+(lv?lv.n:1)+'.','info',org&&p.phase==='confirmacao'?btn('editask','Editar proposta',{c:'sm'}):'');

  }

/* ===== Confirmação (HU-21 a HU-23) ===== */
function verCard(p,v,curr,extra){
  const E=elig(p);
  let h='<div class="card"><div class="row"><h3>Versão v'+v.n+'</h3><div class="row start">'+(curr?chip('Versão atual','acc',1):chip('Versão antiga','',1))+'<span class="mono muted">'+fmt(v.at)+'</span></div></div>';
  h+='<div class="list">'+Object.keys(v.snap).map(aid=>{const s=v.snap[aid];return '<div class="li"><div class="l"><b>'+esc(s.name)+catChip(s.cat)+'</b><span style="font-size:var(--t-subhead)">'+(s.semAcordo?'Titularidade sem acordo':'Titulares: '+esc(s.titulares.map(nm).join(', '))+'. Uso: '+esc(s.uso)+'.')+'</span>'+(s.texto?'<span class="muted" style="font-size:var(--t-footnote)">'+esc(s.texto)+'</span>':'')+'</div></div>'}).join('')+'</div>';
  h+='<div class="cmp">'+E.map(pid=>{const c=v.conf[pid];return '<div><b>'+esc(nm(pid))+'</b>'+(c?(c.v==='ok'?chip('Confirmou','ok',1):chip('Recusou','bad',1))+(c.comment?'<span style="font-size:var(--t-footnote)">'+esc(c.comment)+'</span>':'')+'<span class="mono muted">'+fmt(c.at)+'</span>':chip('Pendente','',1))+'</div>'}).join('')+'</div>';
  if(!curr)h+='<p class="stage-note">Versão anterior, disponível apenas para consulta.</p>';
  return h+(extra||'')+'</div>';
}
function vConf(p){
  let h=head('Confirmação','HU-21 HU-22 HU-23','Leia a versão atual antes de confirmar ou recusar. A decisão é individual e silêncio não conta como confirmação.');
  const lv=lastV(p);
  if(!lv)return h+banner('Ainda não existe versão para confirmar. Quem organiza envia a proposta na etapa Proposta.','info');
  const E=elig(p),me=ui.me,c=lv.conf[me];
  if(p.phase==='consolidado')h+=banner('Todas as pessoas confirmaram a v'+lv.n+'. O memorial está disponível.','info',btn('go','Ver memorial',{c:'pri sm',d:{tab:'memorial'}}));
  const sem=Object.values(lv.snap).some(s=>s.semAcordo);
  if(p.phase==='confirmacao'&&E.every(x=>lv.conf[x]&&lv.conf[x].v==='ok')&&sem)h+=banner('Todos confirmaram, mas há item sem acordo. O projeto não pode ficar Consolidado.','warn',p.org===me?btn('editask','Reabrir proposta',{c:'sm'}):'');
  if(ui.flag.edit&&p.phase==='confirmacao')h+=banner('Editar criará a v'+(lv.n+1)+' e invalidará as confirmações da v'+lv.n+'.','warn','<span class="row start">'+btn('editok','Continuar e editar',{c:'pri sm'})+btn('editno','Cancelar',{c:'sm'})+'</span>');
  const pos=p.phase==='confirmacao'&&E.includes(me)&&!c?'<div class="pos"><h3>Seu posicionamento</h3>'+(ui.flag.refusing?'<div class="field"><label for="rf">Por que você recusa?</label><textarea id="rf" data-in="refuse" placeholder="Explique o que precisa mudar na proposta">'+esc(ui.refuse)+'</textarea>'+errm('refuse')+'</div><div class="row start">'+btn('refuse','Enviar recusa',{c:'bad',d:{n:lv.n}})+btn('refuseno','Cancelar')+'</div>':'<p class="muted">Confirme se a proposta representa o que a equipe combinou. Se algo precisar mudar, recuse e explique o motivo.</p><div class="row start">'+btn('conf','Confirmar v'+lv.n,{c:'pri',d:{n:lv.n}})+btn('refuse','Recusar',{d:{n:lv.n}})+'</div>')+'</div>':'';
  h+=verCard(p,lv,true,pos);
  if(p.phase==='confirmacao'){
    if(!E.includes(me))h+=naoElig();
    else if(c)h+=banner('Sua confirmação da v'+lv.n+' foi registrada. Aguarde a posição das demais pessoas; ausência de resposta não significa concordância.','info');
  }
  if(p.versions.length>1)h+='<details class="more"><summary>Versões anteriores ('+(p.versions.length-1)+')</summary><div class="sec">'+p.versions.slice(0,-1).reverse().map(v=>verCard(p,v,false)).join('')+'</div></details>';
  return h;
}

/* ===== Memorial (HU-24, HU-25) ===== */
function memorialBody(p,at){
  const v=lastV(p),cons=p.phase==='consolidado',L=[],E=elig(p);
  L.push('MEMORIAL DE DECISÕES');L.push('Projeto: '+p.name+' ('+(p.context||'sem contexto')+')');
  L.push('Estado: '+(cons?'Consolidado':'Não consolidado'));L.push('Versão da proposta: v'+v.n);L.push('Gerado em: '+fmt(at));L.push('');
  L.push('PESSOAS');
  p.members.forEach(m=>L.push('- '+nm(m.pid)+', '+roleTxt(p,m.pid).toLowerCase()+(m.status==='naopart'?' (fora da coleta)':m.status==='pendente'?' (Convite pendente)':!m.elig?' (entrou após a coleta)':'')));
  L.push('');L.push('ATIVOS, CONTRIBUIÇÕES E DECISÕES');
  approved(p).forEach(a=>{
    L.push('');L.push(a.name+(a.cat?' ('+a.cat+')':''));
    E.forEach(pid=>{const x=ansOf(p,pid,a.id),s=x&&x.sent;if(s&&s.contrib.includes(pid)){L.push('  Contribuição de '+nm(pid)+': '+s.desc);L.push('  Evidência: '+(s.link||'não informada'))}});
    const s=v.snap[a.id];
    if(s){L.push('  Decisão: '+(s.semAcordo?'SEM ACORDO na titularidade':'titulares '+s.titulares.map(nm).join(', ')+'; uso após a saída: '+s.uso));if(s.texto)L.push('  Texto: '+s.texto)}
  });
  L.push('');L.push('CONFIRMAÇÕES DA v'+v.n);
  E.forEach(pid=>{const c=v.conf[pid];L.push('- '+nm(pid)+': '+(c?(c.v==='ok'?'confirmou':'recusou ('+c.comment+')')+' em '+fmt(c.at):'ainda não se posicionou')) });
  const ref=[];p.versions.forEach(x=>Object.keys(x.conf).forEach(k=>{if(x.conf[k].v==='no')ref.push('- '+nm(k)+' recusou a v'+x.n+': '+x.conf[k].comment)}));
  if(ref.length){L.push('');L.push('RECUSAS REGISTRADAS');ref.forEach(r=>L.push(r))}
  const sem=Object.keys(v.snap).filter(k=>v.snap[k].semAcordo).map(k=>v.snap[k].name);
  if(sem.length){L.push('');L.push('ITENS SEM ACORDO');sem.forEach(s=>L.push('- '+s+', titularidade'))}
  L.push('');L.push(LIMITS);
  return L.join('\n');
}
function vMemorial(p){

};
function tipUI(){const k=ui.me+':'+ui.tab,t=TIPS[ui.tab];if(!t||ui.tips[k])return '';return '<div class="tip-card"><p><b>Como funciona: '+esc((JOURNEY.find(x=>x[0]===ui.tab)||[0,''])[1])+'</b>'+esc(t)+'</p>'+btn('tipok','Entendi',{c:'sm',d:{tab:ui.tab}})+'</div>'}
function vWelcome(p){return '<div class="intro-card welcome"><div class="intro-art">✳</div><div><h3>Como o Backstage funciona</h3><ol><li><b>Cada pessoa responde em particular.</b> Ninguém vê suas respostas até o fim da coleta.</li><li><b>A equipe compara e conversa.</b> As diferenças aparecem lado a lado.</li><li><b>Todos confirmam a proposta.</b> As decisões ficam registradas no memorial.</li></ol><p class="muted" style="margin-top:14px;font-size:var(--t-subhead)">A MIP organiza as decisões da equipe. Ela não substitui contrato, advogado ou registro oficial.</p><div class="row start" style="margin-top:18px">'+btn('welcome','Entendi, ver minha tarefa',{c:'pri'})+'</div></div></div>'}
function taskFor(p,pid=ui.me){
  const m=mem(p,pid),org=p.org===pid,as=approved(p);
  if(!m||m.status==='pendente')return{tab:'equipe',label:'Aceitar convite',note:'Entre no projeto para ver suas tarefas.'};
  if(p.phase==='coleta'){
    if(org&&(p.setupStep==='equipe'||!p.setupStep&&!p.assets.length))return{tab:'equipe',label:'Preparar equipe',note:'Confira os integrantes e convites antes de listar os ativos.'};
    if(org&&(p.setupStep==='ativos'||!as.length))return{tab:'ativos',label:'Organizar ativos',note:'Defina o que a equipe vai discutir.'};
    if(!as.length)return{tab:'ativos',label:'Aguardar ativos',note:'Quem organiza prepara a lista. Você pode sugerir um ativo.'};
    if(!m.elig)return{tab:'coleta',label:'Acompanhar projeto',note:'Você não participa desta coleta.'};
    const left=as.filter(a=>{const x=ansOf(p,pid,a.id);return !x||!x.sent});
    if(m.elig&&left.length)return{tab:'resp',label:'Continuar respostas',note:left.length+' ativo'+(left.length===1?'':'s')+' aguardando suas respostas.'};
    return{tab:'coleta',label:org?'Acompanhar coleta':'Acompanhar equipe',note:org?'Veja quem respondeu e decida quando encerrar.':'Suas respostas foram enviadas. Aguarde a equipe.'};
  }
  if(p.phase==='encerrada')return{tab:'mapa',label:org?'Analisar respostas':'Ver respostas da equipe',note:'Compare as respostas e converse sobre as diferenças.'};
  if(p.phase==='decisao')return{tab:'decisao',label:org?'Preparar proposta':'Revisar proposta',note:org?'Registre uma proposta para cada ativo.':'Leia e comente enquanto a proposta é preparada.'};
  if(p.phase==='confirmacao'){const v=lastV(p),c=v&&v.conf[pid];return{tab:'conf',label:c||!m.elig?'Acompanhar confirmações':'Confirmar proposta',note:c?'Sua posição foi registrada. Aguarde as demais pessoas.':'Leia a versão atual e registre sua posição.'}}
  return{tab:'memorial',label:'Ver memorial',note:'Consulte o registro das decisões da equipe.'};
}

function journeyIndex(p,pid=ui.me){return Math.max(0,JOURNEY.findIndex(x=>x[0]===taskFor(p,pid).tab))}

function act(a,d){
  const p=cur(),me=ui.me;ui.err={};ui.notice='';

  case 'tipok':ui.tips[me+':'+d.tab]=true;break;

  case 'intro':ui.introSeen=true;break;

  case 'qlist':ui.qasset=null;ui.qstep=0;ui.flag={};break;

  case 'filter':ui.filter=d.f;break;
  case 'open':ui.open=ui.open===d.key?null:d.key;break;

    const e=ui.inv.trim().toLowerCase();

    p.members.push({pid:who,status:'ativo',elig:p.phase==='coleta'});log(p,who,'entrou pelo link de convite');ui.me=who;ui.tab=taskFor(p,who).tab;if(ui.tab==='resp')focusQuestion(p,who);ui.notice='Você entrou no projeto. Veja sua tarefa atual.';say(nm(who)+' entrou no projeto como Ativo'+(p.phase==='coleta'?'.':', mas não participa desta coleta.'));break}
  case 'naopart':{

  case 'aprov':{if(p.phase!=='coleta'||p.org!==me)break;const x=p.assets.find(y=>y.id===d.aid);x.st='ok';log(p,me,'aprovou o ativo '+x.name);break}

  case 'closeno':ui.flag={};break;
  case 'closeok':if(p.org!==me||p.phase!=='coleta'||!approved(p).length||!ui.flag.close)break;p.phase='encerrada';log(p,me,'encerrou a coleta');ui.flag={};ui.tab='mapa';ui.notice='Coleta encerrada. Compare as respostas e prepare a conversa.';say('Coleta encerrada. Compare as respostas da equipe.');break;
  case 'remind':say('Lembrete enviado por e-mail para '+nm(d.pid)+'. O e-mail traz só o link do projeto.');break;
  case 'remindgrp':{const E=elig(p),as=approved(p);const miss=E.filter(pid=>as.some(a=>{const x=ansOf(p,pid,a.id);return !(x&&x.sent)})).map(nm);ui.flag.grp='Pessoal, faltam respostas na MIP: '+miss.join(', ')+'. Acesse mip.app/p/'+p.id;copy(ui.flag.grp);break}
  case 'startdec':if(p.org!==me||p.phase!=='encerrada')break;p.phase='decisao';log(p,me,'começou a preparar a proposta');ui.tab='decisao';ui.notice='Agora registre uma proposta para cada ativo.';break;
  case 'saveprop':{

    const pr=propOf(p,d.aid);
    if(!pr.semAcordo&&(!pr.titulares.length||!pr.uso||!pr.texto.trim())){ui.err['p'+d.aid]='Defina titulares, regra de uso e texto da proposta, ou marque "Sem acordo".';break}
    pr.saved=true;pr.by=me;pr.at=Date.now();ui.dasset=approved(p).find(a=>!propOf(p,a.id).saved)?.id||d.aid;ui.notice=approved(p).every(a=>propOf(p,a.id).saved)?'Todas as propostas foram salvas. Envie a versão para confirmação.':'Proposta salva. Continue com o próximo ativo.';log(p,me,'registrou a proposta de '+p.assets.find(x=>x.id===d.aid).name);say(pr.semAcordo?'Item registrado como sem acordo. O projeto não poderá ficar Consolidado enquanto ele valer.':'Proposta salva.');break}
  case 'tryprop':say('Ação negada: só quem organiza altera a proposta. Use o comentário.','bad');break;

  case 'sendv':{
    if(p.org!==me||p.phase!=='decisao')break;
    const as=approved(p);if(!as.length){ui.err.send='Cadastre ao menos um ativo antes de enviar.';break}if(as.some(a=>!(propOf(p,a.id).saved||propOf(p,a.id).semAcordo&&propOf(p,a.id).saved))){ui.err.send='Conclua a proposta de todos os ativos antes de enviar.';break}
    const snap={};as.forEach(a=>{const pr=p.proposal[a.id];snap[a.id]={name:a.name,cat:a.cat,titulares:clone(pr.titulares),uso:pr.uso,texto:pr.texto,semAcordo:pr.semAcordo}});
    const n=p.versions.length+1;p.versions.push({n,at:Date.now(),snap,conf:{}});p.phase='confirmacao';log(p,me,'enviou a v'+n+' para confirmação');ui.tab='conf';ui.notice='Versão v'+n+' enviada. Cada pessoa deve confirmar ou recusar individualmente.';say('Versão v'+n+' criada. O projeto está Em confirmação.');break}
  case 'editask':ui.flag.edit=true;break;
  case 'editno':ui.flag={};break;
  case 'editok':{if(p.org!==me||p.phase!=='confirmacao')break;p.phase='decisao';ui.flag={};log(p,me,'reabriu a proposta; o próximo envio criará a v'+(p.versions.length+1));ui.tab='decisao';break}
  case 'oldconf':{const lv=lastV(p);say('Ação negada: a versão atual é a v'+lv.n+'. Você foi levado a ela.','bad');break}
  case 'refuseno':ui.flag={};ui.refuse='';break;
  case 'conf':case 'refuse':{
    if(a==='refuse'&&!ui.flag.refusing){ui.flag.refusing=true;ui.focus='rf';break}
    const lv=lastV(p);if(+d.n!==lv.n||p.phase!=='confirmacao'){say('Ação negada: só é possível se posicionar sobre a versão atual.','bad');break}

    if(a==='refuse'){
      if(!ui.refuse.trim()){ui.err.refuse='Explique o motivo da recusa';break}
      lv.conf[me]={v:'no',comment:ui.refuse.trim(),at:Date.now()};p.phase='decisao';ui.tab='decisao';ui.notice='Recusa registrada. A proposta voltou para revisão de quem organiza.';ui.refuse='';ui.flag={};log(p,me,'recusou a v'+lv.n);say('Recusa registrada. A proposta voltou para ajustes.');break}
    lv.conf[me]={v:'ok',comment:'',at:Date.now()};log(p,me,'confirmou a v'+lv.n);
    if(elig(p).every(x=>lv.conf[x]&&lv.conf[x].v==='ok')&&!Object.values(lv.snap).some(s=>s.semAcordo)){p.phase='consolidado';ui.tab='memorial';ui.notice='A equipe confirmou a proposta. O memorial pode ser gerado agora.';say('Todos confirmaram a v'+lv.n+'. O projeto está Consolidado.')}else{ui.notice='Sua confirmação foi registrada. Aguarde as demais pessoas.';say('Confirmação registrada.')}break}
  case 'genmem':genMem(p);return;
  case 'copymem':copy(p.memorials[0].body+'\n\nCódigo de verificação (SHA-256): '+p.memorials[0].hash);return;
  case 'pasteorig':ui.verifyText=p.memorials[0].body+'\n\nCódigo de verificação (SHA-256): '+p.memorials[0].hash;ui.verify=null;break;
  case 'pastealt':ui.verifyText=(p.memorials[0].body+'\n\nCódigo de verificação (SHA-256): '+p.memorials[0].hash).replace('Estado: ','Estado: (alterado) ');ui.verify=null;break;
  case 'verify':doVerify();return;
  case 'mkproj':{
    if(!ui.novo.person.trim()){ui.err.person='Informe seu nome';break}
    if(!ui.novo.name.trim()){ui.err.pn='Informe o nome do projeto';break}

function delAsset(p,aid){const x=p.assets.find(y=>y.id===aid);p.assets=p.assets.filter(y=>y.id!==aid);Object.values(p.answers).forEach(o=>delete o[aid]);delete p.proposal[aid];log(p,ui.me,'excluiu o ativo '+x.name+' e descartou as respostas');say('Ativo excluído e registrado no histórico.')}
function sendAnswer(p,aid){
  if(!approved(p).some(a=>a.id===aid))return false;
  if(p.phase!=='coleta'||!elig(p).includes(ui.me))return false;
  const me=ui.me,an=ensureAns(p,me,aid),d=an.draft,E=elig(p);
  d.contrib=d.contrib.filter(x=>E.includes(x));d.titular=d.titular.filter(x=>E.includes(x));
  let bad=false;
  QK.forEach(q=>{if(QS[q].multi?!d[q].length:!d[q]){ui.err[aid+':'+q]='Responda esta pergunta para enviar';bad=true}});
  if(d.contrib.includes(me)&&!d.desc.trim()){ui.err[aid+':desc']='Descreva sua contribuição';bad=true}
  if(d.link.trim()&&!/^https?:\/\/\S+$/i.test(d.link.trim())){ui.err[aid+':link']='Informe um link válido, começando com http';bad=true}
  if(bad){ui.qstep=QK.findIndex(q=>ui.err[aid+':'+q]);if(ui.qstep<0)ui.qstep=0;say('Revise o campo destacado para enviar.','bad');return false}
  const had=!!an.sent;d.link=d.link.trim();an.sent=Object.assign(clone(d),{at:Date.now()});
  log(p,me,(had?'alterou':'enviou')+' as respostas de '+p.assets.find(x=>x.id===aid).name);
  say('Respostas de '+p.assets.find(x=>x.id===aid).name+' registradas em '+fmt(an.sent.at)+'.');
  return true;
}
async function genMem(p){const at=Date.now(),body=memorialBody(p,at),hash=await sha(body);p.memorials.unshift({at,body,hash});log(p,ui.me,'gerou o memorial');say('Memorial gerado com código de verificação.');render()}
async function doVerify(){
  const t=ui.verifyText.replace(/\n*Código de verificação \(SHA-256\):.*$/s,'');
  if(!ui.verifyText.trim()){ui.verify={ok:false,msg:'Cole o texto do memorial para verificar.'};render();return}
  const h=await sha(t);let f=null;projects.forEach(p=>p.memorials.forEach(m=>{if(m.hash===h)f=m}));
  ui.verify=f?{ok:true,msg:'Este arquivo corresponde ao memorial gerado em '+fmt(f.at)}:{ok:false,msg:'Este arquivo não corresponde a nenhum memorial gerado pela MIP'};render();
}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset)});
document.addEventListener('input',e=>{
  const t=e.target,x=t.dataset;if(!x.in)return;const p=cur();
  if(x.in==='inv')ui.inv=t.value;
  else if(x.in==='refuse')ui.refuse=t.value;
  else if(x.in==='vtext')ui.verifyText=t.value;
  else if(x.in==='refsug')ui.refSug[x.a]=t.value;
  else if(x.in==='cmt')ui.cmt[x.a]=t.value;
  else if(x.in==='novo')ui.novo[x.k]=t.value;
  else if(x.in==='addA'||x.in==='sug')ui[x.in][x.k]=t.value;
  else if(x.in==='ans'){ensureAns(p,ui.me,x.a).draft[x.k]=t.value;persist()}
  else if(x.in==='prop'){const pr=propOf(p,x.a);pr[x.k]=t.value;pr.saved=false}
  persist();
});
document.addEventListener('change',e=>{
  const t=e.target,x=t.dataset;if(!x.ch)return;const p=cur();
  if(x.ch==='who'){ui.me=t.value;ui.err={};ui.flag={};ui.refuse='';ui.tab='home'}
  else if(x.ch==='proj'){ui.pid=t.value;ui.err={};ui.flag={};ui.open=null;ui.tab=taskFor(cur()).tab;ui.qasset=null}
  else if(x.ch==='ans'){const d=ensureAns(p,ui.me,x.a).draft;ui.err={};if(x.q==='uso')d.uso=x.v;else{const i=d[x.q].indexOf(x.v);i<0?d[x.q].push(x.v):d[x.q].splice(i,1)}}
  else if(x.ch==='prop'){const pr=propOf(p,x.a);pr.saved=false;ui.err={};if(x.q==='uso')pr.uso=x.v;else if(x.q==='sem')pr.semAcordo=t.checked;else{const i=pr.titulares.indexOf(x.v);i<0?pr.titulares.push(x.v):pr.titulares.splice(i,1)}}
  persist();render();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in==='addA'||t.dataset.in==='sug'){}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.in==='addA'||t.dataset.in==='sug'){ui[t.dataset.in][t.dataset.k]=t.value}});

document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.id==='fn'&&(t.dataset.in==='addA'||t.dataset.in==='sug')){e.preventDefault();act(t.dataset.in==='addA'?'addasset':'sugasset',{})}});

seed();restore();render();
</script>
