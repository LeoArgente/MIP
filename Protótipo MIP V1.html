.landing-projects{margin-top:-30px}.landing-project-list{background:var(--surface);border-radius:18px;padding:4px 26px}.landing-project{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-top:1px solid var(--line)}.landing-project:first-child{border-top:0}.landing-project h3{margin-bottom:5px}.landing-project p{color:var(--muted)}

@media(max-width:900px){.landing{gap:75px}.landing-hero{grid-template-columns:1fr}.landing-art{min-height:250px}.orbit-one{width:250px}.orbit-two{width:160px}.art-core{width:112px}.art-caption{bottom:22px}.landing-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.wrap{padding-block:16px 48px}.top{padding-bottom:20px}.landing{gap:62px}.landing-hero{border-radius:22px;min-height:auto}.landing-copy{padding:35px 28px;gap:18px}.landing-copy h1{font-size:clamp(38px,10vw,52px)}.landing-art{min-height:190px}.orbit-one{width:165px}.orbit-two{width:110px}.art-core{width:78px;font-size:28px}.art-caption{display:none}.landing-reason{padding:0 8px}.landing-reason p{font-size:16px}.landing-section-head{display:block}.landing-section-head>p{margin-top:12px}.landing-steps{grid-template-columns:1fr 1fr;gap:8px}.landing-step{padding:18px;min-height:164px}.landing-step h3{font-size:17px}.landing-step p{font-size:12px}.landing-outcome{padding:32px 27px}.landing-project{align-items:flex-start;flex-direction:column}.onboarding-shell{margin:25px auto 50px}.onboarding-intro p{font-size:16px}.card{padding:20px}.project-hero{min-height:0}.landing-actions{gap:17px}}
@media(max-width:380px){.landing-steps{grid-template-columns:1fr}.landing-step{min-height:126px}.landing-copy{padding:31px 24px}}
html{scroll-behavior:smooth}::placeholder{color:var(--muted);opacity:.8}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* Revisão HIG + carga cognitiva: tarefa acima da dobra, progresso compacto no celular, dicas por etapa */
.project-hero{min-height:0;padding:clamp(20px,3vw,28px);align-items:center;border-radius:18px;margin-bottom:12px}.project-hero h1{font-size:clamp(26px,3.4vw,36px);margin:6px 0 0}.project-hero p{margin-top:6px}
.journey-step{padding:6px 2px;min-height:44px;border-radius:12px}button.journey-step{background:none;border:0;font-family:inherit;font-size:13px;line-height:1.3;cursor:pointer}button.journey-step:hover{background:var(--surface2)}button.journey-step:hover .journey-dot{transform:scale(1.08)}.journey-step.viewing .journey-dot{outline:2px solid var(--ink);outline-offset:2px}.journey-step.viewing{color:var(--ink);font-weight:700}div.journey-step{cursor:default}
.more{border-top:1px solid var(--line);padding-top:6px}.more summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}.more[open] summary{margin-bottom:10px}.more .list{padding-bottom:6px}
.pos{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}.link-inline{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.journey-compact{display:none}.journey-bar{display:flex;gap:4px;margin-top:8px}.journey-bar span{flex:1;height:5px;border-radius:99px;background:var(--surface2)}.journey-bar span.done{background:var(--ok)}.journey-bar span.current{background:var(--accent)}
@media(max-width:600px){.journey-steps{display:none}.journey-compact{display:block;margin-top:8px;font-size:15px}}
.nav-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;margin-bottom:22px}.nav-row .secondary-nav{margin:0}.secondary-nav summary{min-height:44px}.journey button{min-height:44px}
.link-btn{background:none;border:0;padding:10px 0;min-height:44px;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tip-card{background:var(--surface2);border-radius:16px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}.tip-card p{max-width:680px}.tip-card b{display:block;margin-bottom:4px}
.welcome{max-width:760px;margin:24px auto 0}.welcome h3{margin:6px 0 12px}.welcome ol{margin:0;padding-left:22px;display:grid;gap:10px}
.landing-projects{margin-top:0}
.item.conv::before{background:var(--ok)}.item.div::before{background:repeating-linear-gradient(90deg,var(--warn) 0 5px,transparent 5px 9px)}

/* Escala tipográfica da HIG (iOS) em todos os aparelhos: a escala do macOS é para apps nativos e fica pequena na web. */
:root{--t-large:34px;--t-title1:28px;--t-title2:22px;--t-title3:20px;--t-headline:17px;--t-body:17px;--t-callout:16px;--t-subhead:15px;--t-footnote:13px;--t-caption1:12px;--t-caption2:11px}
body,p,.btn,.opt,.paper,input,select,textarea,.landing-copy p,.landing-reason p,.landing-outcome p,.onboarding-intro p,.home-hero p{font-size:var(--t-body)}
h1,.landing-copy h1,.onboarding-intro h1,.project-hero h1,.home-hero h1{font-size:var(--t-large);line-height:1.12}
h2,.landing-reason h2,.landing-outcome h2,.landing-section-head h2{font-size:var(--t-title1);line-height:1.18}
.question-card h3,.task-card h3,.intro-card h3,.home-project h3,.cnt b{font-size:var(--t-title2);line-height:1.22}
h3,.landing-step h3,.landing-project h3,.brand b{font-size:var(--t-title3);line-height:1.25}
.field>label,.q,.tip-card b,.journey-compact b,.review-grid b{font-size:var(--t-headline);font-weight:700}
.journey-compact{font-size:var(--t-headline)}
.head p,.onboarding-intro p{font-size:var(--t-callout)}
.btn.sm,.link-btn,.link-inline,.secondary-nav summary,.more summary,.landing-step p,.landing-project p,.landing-section-head>p,.landing-actions a{font-size:var(--t-subhead)}
.stage-note,.err,.tok,.mono,.test-controls summary,details.demo summary,#toast div{font-size:var(--t-footnote)}
.journey-step,button.journey-step{font-size:var(--t-subhead)}
.chip{font-size:var(--t-footnote)}
.cnt span,.step-number,.journey-dot{font-size:var(--t-caption1)}
.brand span,.art-caption,.hu{font-size:var(--t-caption2)}
.tip-card p{font-size:var(--t-subhead)}

/* Barra de ações no rodapé: ação principal sempre no mesmo lugar, à direita; no celular ocupa a largura e fica ao alcance do polegar. */
.actionbar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 16px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);box-shadow:-16px 0 0 var(--bg),16px 0 0 var(--bg)}
.actionbar .note{margin-right:auto;color:var(--muted);font-size:var(--t-subhead);max-width:560px}
.actionbar.warn{border-top:2px solid var(--warn)}.actionbar.warn .note{color:var(--ink)}
.actionbar .acts{display:flex;gap:10px}
.actionbar .btn:hover{transform:none}
@media(max-width:600px){.actionbar{flex-direction:column;align-items:stretch;gap:10px}.actionbar .note{margin:0}.actionbar .acts .btn{flex:1}.actionbar .acts .btn.pri{flex:2}}
/* Tipo de ativo: cartões de escolha única com exemplo. */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.type{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px 16px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.type input{position:absolute;opacity:0;pointer-events:none}
.type b{font-size:var(--t-headline)}.type span{font-size:var(--t-footnote);color:var(--muted)}
.type:hover{border-color:var(--ink)}
.type:has(input:checked){border-color:var(--ink);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--ink)}
.type:has(input:checked) b::after{content:' ✓'}
.type:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:380px){.types{grid-template-columns:1fr 1fr}}
/* Pergunta: opções em lista vertical, uma por linha. */
.question-card .opts{grid-template-columns:1fr;max-width:560px}
.question-card>.row .stage-note{margin:0}
.review-row{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--surface2);border:0;border-radius:12px;padding:14px 16px;color:var(--ink);cursor:pointer;min-height:44px}
.review-row b{font-size:var(--t-subhead);color:var(--muted);font-weight:600}.review-row span{font-size:var(--t-body)}
.review-row:hover{box-shadow:inset 0 0 0 1px var(--ink)}
/* Tela de perguntas: uma coluna central, lista agrupada de opções e ações logo abaixo do conteúdo, sem barra fixa.
   Computador: ocupa a altura da janela sem rolar a página. Celular: rola normalmente. */
.qs{display:flex;flex-direction:column}
.qs-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 0}
.qs-exit{justify-self:start;background:none;border:0;color:var(--ink);font:600 var(--t-body) var(--f-body);min-height:44px;padding:0 4px;cursor:pointer}
.qs-exit:hover{color:var(--muted)}
.qs-ctx{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.qs-ctx b{font-size:var(--t-headline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qs-ctx span{font-size:var(--t-footnote);color:var(--muted)}
.qs-count{justify-self:end;font-size:var(--t-subhead);color:var(--muted);font-variant-numeric:tabular-nums}
.qs-progress{height:3px;background:var(--surface2);border-radius:99px;overflow:hidden}
.qs-progress span{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s ease}
.qs-main{flex:1;display:flex;flex-direction:column}
.qs-col{width:100%;max-width:560px;margin:0 auto;padding:32px 0 40px;display:flex;flex-direction:column;gap:20px;animation:qs-in .22s ease-out}
.qs-col.wide{max-width:900px;padding:20px 0 24px;gap:16px}
@keyframes qs-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qs-step{font-size:var(--t-subhead);color:var(--muted)}
.qs-head{display:flex;flex-direction:column;gap:8px}
.qs-title{font-family:var(--f-display);font-size:var(--t-title1);line-height:1.18;letter-spacing:-.02em;margin:0}
.qs-title:focus{outline:none}
.qs-hint{color:var(--muted);font-size:var(--t-callout)}
/* Lista agrupada: linhas de 52px com divisória fina; a escolha aparece como marca à direita. */
.qs-list{background:var(--surface);border-radius:14px;overflow:hidden}
.qs-row{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 16px;cursor:pointer;font-size:var(--t-body)}
.qs-row+.qs-row::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line);opacity:.6}
.qs-row input{position:absolute;opacity:0;pointer-events:none}
.qs-row>span:first-of-type{flex:1}
.qs-row:hover{background:var(--surface2)}
.qs-row:active{background:var(--accent-soft)}
.qs-row:has(input:focus-visible){box-shadow:inset 0 0 0 2px var(--ink)}
.qs-mark{width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--bg)}
.qs-row.multi .qs-mark{border:1.5px solid var(--muted);border-radius:50%}
.qs-row:has(input:checked) .qs-mark{background:var(--ink);border-color:var(--ink);border-radius:50%}
.qs-row:has(input:checked) .qs-mark::after{content:'✓'}
.qs-row.dis{cursor:default;opacity:.7}.qs-row.dis:hover{background:none}
.qs-foot{font-size:var(--t-footnote);color:var(--muted);margin:-12px 16px 0}
.qs-field{display:flex;flex-direction:column;gap:8px}
.qs-field label{font-size:var(--t-subhead);color:var(--muted)}
.qs-field textarea,.qs-field input{background:var(--surface);border:1px solid transparent;border-radius:14px;padding:14px 16px;width:100%}
.qs-field textarea{min-height:120px}
/* Botões do mesmo tamanho; a escolha principal se distingue pelo estilo, não pelo tamanho. */
.qs-actions{display:flex;gap:12px;margin-top:4px}
.qs-actions .btn{flex:1;min-height:50px;border-radius:12px;font-size:var(--t-body)}
.qs-actions .btn:hover{transform:none;box-shadow:none}
.qs-actions .btn:active{filter:brightness(.85)}
.qs-private{font-size:var(--t-footnote);color:var(--muted);text-align:center}
/* Revisão: seções agrupadas; cada linha leva de volta à pergunta. */
.qs-review{display:grid;gap:20px}
.qs-sec>p{font-size:var(--t-footnote);color:var(--muted);font-weight:600;margin:0 16px 6px}
.qs-stack{display:flex;flex-direction:column;gap:20px}
.qs-rrow{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.qs-rrow+.qs-rrow::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line);opacity:.6}
.qs-rrow:hover{background:var(--surface2)}
.qs-rrow b{font-weight:500;font-size:var(--t-subhead);flex:none;max-width:45%}
.qs-rrow span{flex:1;text-align:right;color:var(--muted);font-size:var(--t-subhead);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-rrow i{font-style:normal;color:var(--muted)}
@media(max-width:600px){.qs-col{padding-top:24px}.qs-title{font-size:var(--t-title2)}.qs-count{font-size:var(--t-footnote)}}
@media(min-width:761px) and (min-height:560px){
  body.focus-mode{overflow:hidden}
  body.focus-mode .wrap{padding-block:0}
  .qs{height:100dvh;min-height:0}
  .qs-main{min-height:0;overflow:auto}
  .qs-col{margin:auto}
  .qs-review{grid-template-columns:1fr 1fr;align-items:start}
}
/* ===== Sistema visual unificado: todas as etapas seguem a linguagem da tela de perguntas =====
   Coluna central, grupos com cantos de 16px sem sombra, listas com divisórias finas,
   ações no fim do conteúdo (sem barra fixa) e botões do mesmo tamanho, diferenciados pelo estilo. */
.proj{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 0 4px}
.proj-id{display:flex;flex-direction:column;min-width:0}
.proj-id b{font:700 var(--t-title3) var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-id span{font-size:var(--t-footnote);color:var(--muted)}
.proj-back{background:none;border:0;color:var(--ink);font:600 var(--t-subhead) var(--f-body);min-height:44px;padding:0;cursor:pointer;white-space:nowrap}
.proj-back:hover{color:var(--muted)}
.top{padding-bottom:12px}
.journey-progress{margin-bottom:4px}
.nav-row{max-width:680px;margin:0 auto 4px}
.sec{max-width:680px;gap:24px;animation:qs-in .22s ease-out}
.head{gap:8px}.head h2{font-size:var(--t-title1);line-height:1.18}.head p{font-size:var(--t-callout)}
.card,.item,.paper{background:var(--surface);border:0;border-radius:16px;box-shadow:none}
.card{padding:20px;gap:14px}
.card h3,.item b{letter-spacing:0}
.card h3{font:700 var(--t-headline) var(--f-body)}
.li{position:relative;border-top:0;padding:14px 0}
.li+.li::before{content:'';position:absolute;top:0;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.item{padding:18px 20px;gap:14px}
.item.conv::before,.item.div::before,.item.pend::before{display:none}
.g-list{background:var(--surface);border-radius:16px;overflow:hidden}
.g-row{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;min-height:60px;padding:12px 16px}
.g-row+.g-row::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line);opacity:.6}
.g-l{display:flex;flex-direction:column;min-width:0}.g-l b{font-size:var(--t-body);font-weight:600}.g-l span{font-size:var(--t-footnote);color:var(--muted)}
.g-r{display:flex;align-items:center;gap:10px}
.btn{border-radius:12px;box-shadow:none}
.btn:hover{transform:none;box-shadow:none;border-color:var(--muted)}
.btn.pri{box-shadow:none}.btn.pri:hover{filter:brightness(.9);border-color:var(--accent)}
.btn:active{filter:brightness(.85)}
.btn.sm{min-height:36px;padding:6px 14px;border-radius:999px;background:var(--surface2);border-color:transparent}
.btn.sm.pri{background:var(--accent);color:var(--accent-ink)}
.btn.bad{border-style:solid;border-width:1px}
@media(pointer:coarse){.btn.sm{min-height:44px}}
.actionbar{position:static;flex-direction:column;align-items:stretch;gap:10px;padding:4px 0 0;margin:0;background:none;border:0;box-shadow:none}
.actionbar.warn{border:0}
.actionbar .note{margin:0;max-width:none;color:var(--muted);font-size:var(--t-subhead)}
.actionbar.warn .note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px}
.actionbar .acts{display:flex;gap:12px}
.actionbar .acts .btn,.actionbar .acts .btn.pri{flex:1;min-height:50px;font-size:var(--t-body)}
.banner,.banner.info,.banner.warn,.banner.bad{border:0;border-radius:12px}
.banner.warn{background:var(--warn-soft)}.banner.bad{background:var(--bad-soft)}
.counters{gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.cnt{background:none;border-radius:10px;padding:10px 8px;text-align:center}
.cnt.on{background:var(--surface2);box-shadow:none}
.cnt b{font-size:var(--t-title3)}
.tip-card{background:var(--surface);border-radius:16px}
.intro-card{border-radius:16px}
.paper{padding:24px}
.cmp>div{border-radius:12px}
select,input[type=text],input[type=email],textarea{border-radius:12px}
.g-h{font-size:var(--t-footnote);font-weight:600;color:var(--muted);margin:0 16px 6px}
.item-row{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;gap:14px}
.item-row .l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.item-row .cmp{align-items:start}
.item-row>.row{width:100%}
.item-row .l b{font-weight:500;font-size:var(--t-body)}
.item-row.open{background:rgba(255,255,255,.02)}
#app>.banner{max-width:680px;margin:0 auto 8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:8px 0 0;font-size:var(--t-subhead)}
.kv dt,.kv dd{margin:0;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.kv dt{color:var(--muted)}.kv dd{text-align:right}
.li>.l:has(.kv){flex:1 1 100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== Hierarquia tipográfica e tamanhos de controle =====
   Uma escala, um papel por tamanho (proporções da HIG, ajustadas para tela de computador):
   28 título da tela · 20 número em destaque · 17 seção · 16 corpo · 15 rótulo de campo e botão
   14 texto de apoio · 13 legenda · 12 selo. Fonte de exibição só nos títulos de tela; o resto usa a fonte do corpo.
   Botões: 40px (padrão), 44px (ação que avança a etapa), 32px (ação pequena; 44px em tela de toque). */
:root{--t-title1:28px;--t-title2:22px;--t-title3:20px;--t-headline:17px;--t-body:16px;--t-callout:15px;--t-subhead:14px;--t-footnote:13px;--t-caption1:12px;--t-caption2:11px}
body,p,.paper,input,select,textarea{font-size:var(--t-body);line-height:1.5}
/* Títulos de tela */
.head h2,.qs-title{font:700 var(--t-title1)/1.15 var(--f-display);letter-spacing:-.02em}
.head p,.qs-hint{font-size:var(--t-callout);line-height:1.45}
/* Contexto do projeto: menor que o título da tela, para não competir com ele */
.proj-id b{font:600 var(--t-headline)/1.3 var(--f-body);letter-spacing:0}
.proj-id span{font-size:var(--t-footnote)}
.brand b{font-size:var(--t-title3)}
/* Seção dentro da tela */
.card h3,.item-row .l b,.tip-card b,.pos h3,.welcome h3{font:600 var(--t-headline)/1.3 var(--f-body);letter-spacing:0}
.g-h,.qs-sec>p,.qs-step,.fq-grp{font-size:var(--t-footnote);font-weight:600;color:var(--muted);letter-spacing:.01em}
/* Rótulos de campo: abaixo da seção, acima do corpo */
.field>label,.field>.q,.q,.review-grid b{font:600 var(--t-callout)/1.35 var(--f-body)}
.field .muted{font-weight:400}
/* Corpo e linhas de lista */
.g-l b,.li b,.qs-row,.qs-rrow b{font-size:var(--t-body);font-weight:500}
.opt,.qs-field input,.qs-field textarea{font-size:var(--t-callout)}
/* Texto de apoio e legendas */
.muted,.g-l span,.li .muted,.tip-card p,.actionbar .note,.qs-foot,.qs-private,.stage-note,.link-btn,.link-inline,.proj-back{font-size:var(--t-subhead)}
.li span[style*="footnote"],.err,.mono,.tok,#toast div,.qs-ctx span,.qs-count{font-size:var(--t-footnote)}
.chip{font-size:var(--t-caption1);font-weight:600;padding:3px 9px}
.journey-step,button.journey-step{font-size:var(--t-footnote)}
.journey-dot{width:26px;height:26px;font-size:var(--t-caption1)}
.cnt b{font:600 var(--t-title3)/1.2 var(--f-body)}.cnt span{font-size:var(--t-caption1)}
.type b{font-size:var(--t-callout)}.type span{font-size:var(--t-caption1)}
.qs-ctx b{font-size:var(--t-callout)}
/* Botões */
.btn{font:600 var(--t-callout)/1.2 var(--f-body);min-height:40px;padding:8px 16px;border-radius:10px}
.btn.sm{font-size:var(--t-footnote);min-height:32px;padding:5px 12px}
.actionbar .acts .btn,.actionbar .acts .btn.pri,.qs-actions .btn{min-height:44px;font-size:var(--t-callout);border-radius:10px}
.actionbar .acts,.qs-actions{justify-content:flex-end}
.actionbar .acts .btn,.actionbar .acts .btn.pri,.qs-actions .btn,.qs-actions .btn.pri{flex:0 1 auto;min-width:140px}
.qs-exit{font-size:var(--t-callout)}
@media(pointer:coarse){.btn,.btn.sm{min-height:44px}}
@media(max-width:600px){.actionbar .acts .btn,.actionbar .acts .btn.pri,.qs-actions .btn,.qs-actions .btn.pri{flex:1;min-width:0}}
/* Opções: linhas de 48px */
.qs-row{min-height:48px;padding:10px 16px}
.qs-rrow{min-height:44px;padding:8px 16px}
.qs-rrow b,.qs-rrow span{font-size:var(--t-subhead)}
.fq .opt,.question-card .opt{min-height:44px}
.nav-row .link-btn{font-weight:500;color:var(--muted);text-decoration:none;padding:6px 0;min-height:32px}
.nav-row .link-btn:hover{color:var(--ink)}
/* Telas do projeto: marca, cabeçalho, etapas e conteúdo na mesma coluna, no computador e no celular. */
.wrap:has(.proj) .top,.proj,.journey-progress,.nav-row,.sec,#app>.banner{max-width:760px;margin-inline:auto}
.journey-steps{grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.journey-step,button.journey-step{min-width:0}
.journey-step>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* ===== Formulário familiar e layout limpo =====
   Controles nativos (círculo para escolha única, quadrado para várias) à esquerda do texto, como em formulários comuns;
   campos com borda; seções separadas por espaço e linha fina. Fundo de cartão só onde agrupa algo de fato:
   dica da etapa, aviso, documento do memorial e respostas lado a lado na Comparação. */
input[type=radio],input[type=checkbox]{accent-color:var(--ink);width:18px;height:18px;margin:0;flex:none;cursor:pointer}
select,input[type=text],input[type=email],textarea,.qs-field input,.qs-field textarea{background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 12px}
select:hover,input[type=text]:hover,input[type=email]:hover,textarea:hover{background:transparent;border-color:var(--muted)}
select:focus,input[type=text]:focus,input[type=email]:focus,textarea:focus{background:transparent;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
/* Seções sem cartão */
.card{background:none;border-radius:0;padding:0;box-shadow:none}
.sec>.card+.card,.sec>.card+.g-sec,.sec>.g-list+.card{border-top:1px solid var(--line);padding-top:24px}
.g-list{background:none;border-radius:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.g-row{padding:12px 0}.g-row+.g-row::before{left:0}
.item-row.open{background:none}
.li+.li::before{opacity:1}
/* Opções em formulários (cadastro, proposta): rádio ou caixa + texto, sem pílula */
.opts{gap:2px 24px}
.opt,.question-card .opt,.fq .opt{border:0;background:none;border-radius:0;padding:8px 0;min-height:40px;gap:10px;box-shadow:none}
.opt:hover{transform:none;background:none}
.opt:has(input:checked){background:none;border:0}
/* Tipo de ativo: lista de opções em duas colunas */
.types{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}
.type{display:grid;grid-template-columns:18px 1fr;column-gap:12px;align-items:start;border:0;background:none;border-radius:0;padding:8px 0;min-height:44px;box-shadow:none}
.type input{position:static;opacity:1;pointer-events:auto;grid-row:1/3;margin-top:2px}
.type:hover,.type:has(input:checked){border:0;background:none;box-shadow:none}
.type:has(input:checked) b::after{content:none}
.type b{font-weight:500}
@media(max-width:480px){.types{grid-template-columns:1fr}}
/* Tela de perguntas no formato de formulário */
.qs-list{background:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:2px}
.qs-row{gap:12px;min-height:44px;padding:10px 12px;margin:0 -12px;border-radius:8px}
.qs-row+.qs-row::before{content:none}
.qs-row input{position:static;opacity:1;pointer-events:auto}
.qs-row:hover{background:var(--surface)}
.qs-row:has(input:checked){background:var(--surface)}
.qs-row:has(input:focus-visible){box-shadow:inset 0 0 0 2px var(--ink)}
.qs-foot{margin:-8px 0 0}
.qs-review .qs-list{border-top:1px solid var(--line);gap:0}
.qs-rrow{padding:10px 0;border-bottom:1px solid var(--line)}
.qs-rrow+.qs-rrow::before{content:none}
.qs-rrow:hover{background:none}.qs-rrow:hover i{text-decoration:underline}
.qs-rrow i{font-size:var(--t-footnote);color:var(--ink);font-weight:600}
.qs-sec>p{margin:0 0 6px}
.tip-card{background:var(--surface)}
/* Cartão do formulário: pergunta, opções e botões agrupados, como uma pergunta no Google Forms. */
.qs-card{background:var(--surface);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:20px}
.qs-card .qs-row:hover,.qs-card .qs-row:has(input:checked){background:var(--surface2)}
.qs-card .qs-field input,.qs-card .qs-field textarea{background:transparent}
.qs-card .qs-actions{margin-top:8px}
@media(max-width:600px){.qs-card{padding:20px}}
.qs-col.wide .qs-card{padding:24px 28px;gap:14px}
.qs-col.wide .qs-rrow{min-height:40px;padding:8px 0}
/* Conteúdo de cada etapa dentro de cartões, no mesmo padrão do cartão das perguntas. */
.card{background:var(--surface);border-radius:16px;padding:24px 28px;box-shadow:none}
.sec>.card+.card,.sec>.card+.g-sec,.sec>.g-list+.card{border-top:0;padding-top:24px}
.g-list{background:var(--surface);border-radius:16px;border:0;padding:4px 20px}
.g-row{padding:14px 0}
.sec>.g-list+.card,.sec>.card+.g-list{margin-top:0}
.card .tok{background:var(--surface2)}
@media(max-width:600px){.card{padding:20px}.g-list{padding:2px 16px}}
/* Um cartão por etapa: título, seções (separadas por linha fina) e botões no mesmo bloco, como na tela de perguntas. */
.step-card{background:var(--surface);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:24px;min-width:0}
.step-card>.card,.step-card .card,.step-card>.g-list,.step-card .g-list{background:none;border-radius:0;padding:0;box-shadow:none}
.step-card>.card,.step-card>.g-sec,.step-card>.g-list,.step-card>.counters+.g-sec{border-top:1px solid var(--line);padding-top:24px}
.step-card>.g-sec .g-list{border-top:0}
.step-card .g-row{padding:14px 0}
.step-card .banner,.step-card .tok,.step-card .cmp>div,.step-card .paper{background:var(--surface2)}
.step-card .banner.warn{background:var(--warn-soft)}.step-card .banner.bad{background:var(--bad-soft)}
.step-card .counters{background:var(--surface2)}.step-card .cnt.on{background:var(--surface)}
.step-card .btn.sm{background:var(--surface2)}.step-card .btn.sm.pri{background:var(--accent)}
.step-card .more{border-top:1px solid var(--line)}
.step-card>.actionbar{border-top:1px solid var(--line);padding-top:24px}
.step-card>.actionbar .acts{justify-content:flex-end}
@media(max-width:600px){.step-card{padding:20px;gap:20px}}
.step-card .g-h{margin:0 0 4px}
/* Menos divisórias: seções se separam por espaço e título; linhas só em listas de dados (Comparação e revisão). */
.step-card{gap:32px}
.step-card>.card,.step-card>.g-sec,.step-card>.g-list,.step-card>.counters+.g-sec,.step-card>.actionbar,.step-card .more{border-top:0;padding-top:0}
.step-card .li+.li::before,.li+.li::before{content:none}
.step-card .li{padding:10px 0}
.step-card .g-list:not(.g-sec .g-list) .g-row+.g-row::before{content:none}
.step-card .g-list:not(.g-sec .g-list) .g-row{padding:10px 0}
.step-card .kv dt,.step-card .kv dd{border-top:0;padding:6px 0}
.qs-col:not(.wide) .qs-list{border:0}
/* Links sem sublinhado: o texto em seminegrito já indica que é clicável; ao passar o mouse, fica mais claro. */
a,.link-btn,.link-inline,.landing-actions a,.qs-rrow:hover i,.proj-back{text-decoration:none;border-bottom:0}
.landing-actions a{padding-bottom:0}
.link-btn,.link-inline,.landing-actions a{font-weight:600}
.link-btn:hover,.link-inline:hover,.landing-actions a:hover,.qs-rrow:hover i{opacity:.7}
.proj-acts{display:flex;align-items:center;gap:20px}
.proj-panel{background:var(--surface);border:0;color:var(--ink);font:600 var(--t-subhead) var(--f-body);min-height:36px;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.proj-panel:hover{background:var(--surface2)}
.panel-nav{max-width:760px;margin:4px auto 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg button{background:none;border:0;color:var(--muted);font:600 var(--t-subhead) var(--f-body);padding:8px 16px;min-height:36px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface2);color:var(--ink)}
.seg button:hover{color:var(--ink)}
.journey-steps{grid-template-columns:repeat(5,minmax(0,1fr))}
/* Notas de 0 a 10 */
.qs-scores{display:flex;flex-direction:column;gap:4px}
.qs-score{display:grid;grid-template-columns:1fr 96px 48px;align-items:center;gap:12px;min-height:48px}
.qs-score input{text-align:center;padding:8px;font-variant-numeric:tabular-nums}
.qs-pct{color:var(--muted);font-size:var(--t-subhead);text-align:right;font-variant-numeric:tabular-nums}
.asset-link{font-size:var(--t-footnote);color:var(--muted);overflow-wrap:anywhere}
@media(max-width:600px){.proj{flex-wrap:wrap}.seg{width:100%}.seg button{flex:1;padding:8px 6px}.qs-score{grid-template-columns:1fr 80px 44px}}
/* ===== Página do projeto e navegação de volta ===== */
.hub{gap:24px}
.hub-now{background:var(--surface);border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:8px}
.hub-k{font-size:var(--t-footnote);font-weight:600;color:var(--muted)}
.hub-now h2{font:700 var(--t-title1)/1.15 var(--f-display);letter-spacing:-.02em}
.hub-now p:not(.hub-k){color:var(--muted);font-size:var(--t-callout);max-width:560px}
.hub-act{margin-top:12px}.hub-act .btn{min-height:44px;min-width:180px}
.hub-list .g-list{padding:4px 20px}
.hub-row{width:100%;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.hub-row i{font-style:normal;color:var(--muted);font-size:20px}
button.hub-row:hover b{opacity:.75}
.hub-row.off{cursor:default}.hub-row.off b{color:var(--muted);font-weight:500}
.back-nav{max-width:760px;margin:0 auto 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back-btn{background:none;border:0;color:var(--ink);font:600 var(--t-callout) var(--f-body);min-height:44px;padding:0;cursor:pointer}
.back-btn:hover{opacity:.7}
.back-nav .link-btn{color:var(--muted);font-weight:500;font-size:var(--t-subhead);min-height:44px}
/* Decisões */
.dec{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.dec+.dec{margin-top:16px}
.dec-q{font-weight:600;font-size:var(--t-body)}
.dec .kv{margin:0}
.dec-res{font-size:var(--t-callout)}
.dec-l{font-size:var(--t-footnote);font-weight:600;color:var(--muted);margin-top:4px}
.dec-more summary{cursor:pointer;color:var(--muted);font-size:var(--t-subhead);min-height:32px;display:flex;align-items:center}
.step-card .seg{align-self:flex-start}
.more>.dec{padding-left:0}
@media(max-width:600px){.hub-now{padding:20px}.hub-act .btn{width:100%}}
.wrap:has(.back-nav) .top,.wrap:has(.intro-card) .top{max-width:760px;margin-inline:auto}
.dec .kv{max-width:440px}

/* ===== Grade das telas do projeto: mesmo grid da Home (1160px), conteúdo à esquerda e coluna lateral de 340px à direita =====
   A lateral fica fixa ao rolar no computador e desce para baixo do conteúdo no celular. */
.wrap:has(.proj) .top,.wrap:has(.back-nav) .top,.wrap:has(.intro-card) .top,.proj,.back-nav,#app>.banner,.welcome{max-width:none;margin-inline:0}
.page{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.page.solo{grid-template-columns:minmax(0,1fr)}
.page-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.page-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px;min-width:0}
.page .step-card{max-width:none}
.page .step-card p,.page .step-card .head p{max-width:72ch}
.side-card{background:var(--surface);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side-card h3{font:600 var(--t-headline)/1.3 var(--f-body)}
.side-card .card,.side-card .g-list{background:none;padding:0;border-radius:0}
.side-card .li{padding:8px 0}
.side-card .more{border-top:0}.side-card .more summary{min-height:0;margin:0}
.side-act .actionbar{padding:0}
.side-act .actionbar .acts{flex-direction:column-reverse;align-items:stretch}
.side-act .actionbar .acts .btn,.side-act .actionbar .acts .btn.pri{flex:none;width:100%;min-width:0}
.side-act .actionbar .note{font-size:var(--t-subhead)}
.team{display:flex;flex-direction:column;gap:2px}
.team-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.team-st{display:flex;align-items:center;gap:10px}
.team-st .link-inline{font-size:var(--t-footnote)}
/* Página do projeto: "Agora" e a lista lado a lado em telas largas */
.page.hub .page-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.page.hub .hub-now{justify-content:center}
.page.hub .hub-list .g-list{height:100%}
/* Equipe e ativos: formulário de ativo ao lado da lista */
.step-card .types{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
@media(max-width:1100px){.page.hub .page-main{grid-template-columns:1fr}}
@media(max-width:960px){.page{grid-template-columns:1fr}.page-side{position:static}}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;margin:0 -12px;width:calc(100% + 24px);color:var(--ink);font:inherit;cursor:pointer}
.side-item>span:first-child{display:flex;flex-direction:column;min-width:0}.side-item .muted{font-size:var(--t-footnote)}
.side-item:hover{background:var(--surface2)}.side-item.on{background:var(--surface2)}
.side-card .kv{margin:0}
.side-item .chip,.team-st .chip{flex:none;white-space:nowrap}
.side-item{flex-wrap:nowrap}

/* ===== Ajustes de hierarquia: ação no fim do conteúdo, "Agora" em destaque, lateral estável ===== */
.step-card>.actionbar{flex-direction:row;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:12px 16px;padding-top:8px}
.step-card>.actionbar .note{margin-right:auto;max-width:56ch}
.step-card>.actionbar.warn{flex-direction:column;align-items:stretch}
.step-card>.actionbar.warn .acts{justify-content:flex-end}
.page.hub .page-main{display:flex;flex-direction:column;gap:16px}
.hub-top .hub-now{flex-direction:row;align-items:center;justify-content:space-between;gap:16px 32px;flex-wrap:wrap;padding:24px 28px}
.hub-top .hub-now>div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 360px}
.hub-top .hub-act{margin-top:0}
.hub-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.hub-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.hub-grid .hub-list .g-list{height:auto}
@media(max-width:960px){.hub-grid{grid-template-columns:1fr}}
@media(max-width:600px){.step-card>.actionbar{flex-direction:column;align-items:stretch}.step-card>.actionbar .note{margin:0}.hub-top .hub-act{width:100%}}
/* Selos sem bolinha: a cor e o texto já indicam o estado. */
.chip i{display:none}
.chip{gap:0}
.dec-row{display:grid;grid-template-columns:auto 1fr 96px 52px;align-items:center}
.dec-row:not(:has(input)){grid-template-columns:1fr 96px 52px}
.dec-row small{display:block;color:var(--muted);font-size:var(--t-footnote);font-weight:400}
.dec-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dec-bar i{display:block;height:100%;background:var(--muted);border-radius:3px}
.dec-row:has(input:checked) .dec-bar i{background:var(--ink)}
.dec-n{font-weight:500;font-size:var(--t-subhead);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:520px){.dec-row{grid-template-columns:auto 1fr 52px}.dec-row:not(:has(input)){grid-template-columns:1fr 52px}.dec-bar{display:none}}

<script>
/* ===== Constantes ===== */
/* Perguntas: kind 'people' = escolher pessoas da equipe; senão, uma opção de opts. dec = entra na proposta. */
const QS={
 notas:{label:'Como você percebe a participação de cada pessoa?',hint:'É uma percepção, não um cálculo de propriedade.',kind:'scores',short:'Participação percebida'},
 origem:{label:'Qual é a origem desta criação?',opts:['Criada neste projeto','Criada antes do projeto','Inclui material de terceiros','Origem mista','Não sei'],short:'Origem',dec:true},
 titularAtual:{label:'Qual é a situação da titularidade hoje?',opts:['Há titularidade documentada','Há indicação, sem documento','Há direitos de terceiros','Ainda não sabemos'],short:'Titularidade atual',dec:true},
 titular:{label:'Quem a equipe pretende indicar como titular?',hint:'Esta intenção não comprova a titularidade atual nem transfere direitos.',kind:'people',short:'Titularidade pretendida',dec:true},
 divisao:{label:'Há percentuais de titularidade combinados?',opts:['Sim, a equipe combinou percentuais','Ainda não, precisamos negociar','Não se aplica a esta criação'],short:'Percentuais combinados',dec:true},
 uso:{label:'Quem sair do projeto pode continuar usando esta criação?',hint:'Pense em alguém que deixa a equipe depois.',opts:['Qualquer pessoa que participou','Só quem for dono','Ninguém, sem um novo acordo da equipe'],short:'Uso após a saída',dec:true},
 comercial:{label:'Pode ser vendido ou gerar dinheiro?',opts:['Sim','Só com acordo de todos os donos','Não'],short:'Uso comercial',dec:true},
 portfolio:{label:'Quem pode mostrar no portfólio?',opts:['Todos que criaram','Toda a equipe','Só com autorização dos donos'],short:'Portfólio',dec:true},
 licenca:{label:'Em que condição o código pode ser publicado?',opts:['Após revisar dependências e licenças','Somente com autorização dos titulares','Não publicar por enquanto'],short:'Publicação do código',dec:true},
 marcaRegistro:{label:'O nome ou a marca já foi verificado para uso?',opts:['Sim, com evidência','Ainda precisa de busca ou registro','Há conflito ou uso de terceiro'],short:'Situação da marca',dec:true},
 terceiros:{label:'Há conteúdo de terceiros que exige autorização?',opts:['Não identificamos','Sim, autorização documentada','Sim, autorização pendente','Ainda não sabemos'],short:'Direitos de terceiros',dec:true},
 audioDireitos:{label:'Vozes, samples e gravações têm autorização?',opts:['Não se aplica','Sim, com autorização documentada','Autorização pendente','Ainda não sabemos'],short:'Autorizações de áudio',dec:true},
 invDivulgacao:{label:'Há alguma condição antes de divulgar a invenção?',opts:['Pode divulgar após decisão da equipe','Avaliar proteção e confidencialidade antes','Há obrigação com terceiro','Ainda não sabemos'],short:'Divulgação da invenção',dec:true},
 remix:{label:'Outras pessoas podem adaptar esta criação?',hint:'Ex.: editar, remixar ou criar novas versões a partir dele.',opts:['Sim, livremente','Só com autorização dos donos','Não'],short:'Adaptações',dec:true}
};
const QBASE=['notas','origem','titularAtual','titular','divisao','uso','comercial','portfolio'];
/* Tipos de ativo: cada um pode acrescentar uma pergunta própria (extra). */
const TYPES=[
 {k:'codigo',n:'Código',ex:'App, site, script',ph:'Ex.: Backend, App do aluno',extra:'licenca'},
 {k:'marca',n:'Marca',ex:'Nome, logo, slogan',ph:'Ex.: Logo, Nome do app',extra:'marcaRegistro'},
 {k:'design',n:'Design',ex:'Telas, ilustrações, layout',ph:'Ex.: Telas do app',extra:'terceiros'},
 {k:'conteudo',n:'Texto ou mídia',ex:'Textos, vídeos, fotos',ph:'Ex.: Roteiro, Fotos do evento',extra:'terceiros'},
 {k:'audio',n:'Música e áudio',ex:'Trilha, efeitos, voz',ph:'Ex.: Trilha sonora',extra:'audioDireitos'},
 {k:'invencao',n:'Invenção',ex:'Produto, protótipo, processo',ph:'Ex.: Sensor de umidade',extra:'invDivulgacao'},
 {k:'outro',n:'Outro',ex:'Qualquer outra criação',ph:'Ex.: Planilha de dados',extra:null}
];
const typeOf=a=>TYPES.find(t=>t.k===(a&&a.type));
const qsFor=a=>{const t=typeOf(a);return t&&t.extra?QBASE.concat(t.extra):QBASE};
const decQs=a=>qsFor(a).filter(q=>QS[q].dec);
const isP=q=>QS[q].kind==='people';
const GRP=q=>['notas','desc','origem','titularAtual'].includes(q)?'Origem e situação atual':['titular','divisao'].includes(q)?'Titularidade pretendida':'Uso e condições';
/* Respostas em 3 telas por criação. */
const GROUPS={contrib:['notas','desc','origem','titularAtual'],donos:['titular','divisao'],uso:['uso','comercial','portfolio','licenca','remix','marcaRegistro','terceiros','audioDireitos','invDivulgacao']},GNAME={contrib:'Contribuição e origem',donos:'Titularidade pretendida',uso:'Uso e condições'};
const stepOf=q=>Object.keys(GROUPS).find(g=>GROUPS[g].includes(q));
/* Quanto cada pessoa fez: 4 níveis no lugar de nota de 0 a 10 (a conta usa os valores). */
const LV=[[0,'Nada'],[3,'Pouco'],[6,'Parte'],[10,'Muito']];
const lvOf=n=>LV.reduce((b,x)=>Math.abs(x[0]-n)<Math.abs(b[0]-n)?x:b)[0];
const lvName=n=>LV.find(x=>x[0]===lvOf(+n))[1];
const PH=['coleta','encerrada','decisao','confirmacao','consolidado'];
const PHN={coleta:'Respondendo',encerrada:'Respostas encerradas',decisao:'Decidindo',confirmacao:'Em confirmação',consolidado:'Proposta confirmada'};
const ST={conv:['Respostas iguais','ok'],div:['Respostas diferentes','warn'],pend:['Ainda não respondeu','']};
const SCEN={
 notas:[['Comparar percepções','As respostas ajudam a identificar divergências sobre a participação. Não geram percentuais.'],['Registrar evidências','Converse sobre relatos e links antes de decidir a titularidade pretendida.']],
 titular:[['Titularidade pretendida','Registre quem a equipe pretende indicar e o fundamento.'],['Situação atual separada','Confira documentos e possíveis direitos de terceiros antes de formalizar.'],['Ponto em aberto','Marque a criação como sem acordo e descreva a pendência.']],
 uso:[['Qualquer pessoa que participou','Quem sai continua podendo usar a criação, mesmo sem ser dono.'],['Só quem for dono','Quem sai sem ser dono deixa de usar a criação.'],['Ninguém, sem um novo acordo','Depois da saída, qualquer uso exige um novo acordo da equipe.']]
};
const LIMITS='Este registro reúne as decisões da equipe para uma formalização futura. Ele não substitui contrato, advogado ou registro oficial.';

/* ===== Estado ===== */
let people,projects,ui,tt;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>Math.random().toString(36).slice(2,7);
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(', ',' às ');
const cur=()=>projects.find(x=>x.id===ui.pid);
const nm=pid=>people[pid]?people[pid].name:pid;
const mem=(p,pid)=>p.members.find(m=>m.pid===pid);
const elig=p=>p.members.filter(m=>m.status==='ativo'&&m.elig).map(m=>m.pid);
const approved=p=>p.assets.filter(a=>a.st==='ok');
const ansOf=(p,pid,aid)=>p.answers[pid]&&p.answers[pid][aid];
const log=(p,who,text)=>p.history.unshift({at:Date.now(),who,text});
const lastV=p=>p.versions[p.versions.length-1];
const STORAGE='mip-backstage-v3';
/* Notas de 0 a 10: quem tem nota acima de 0 contribuiu; a participação é a nota dividida pela soma das notas. */
const notasOf=d=>(d&&d.notas)||{};
const hasNota=(n,pid)=>n[pid]!==undefined&&n[pid]!==''&&!isNaN(+n[pid]);
const contribOf=d=>Object.keys(notasOf(d)).filter(k=>+notasOf(d)[k]>0);
const shares=n=>{const ks=Object.keys(n),tot=ks.reduce((s,k)=>s+(+n[k]||0),0),o={};ks.forEach(k=>o[k]=tot?Math.round(100*(+n[k]||0)/tot):0);return o};
function partOf(p,aid){const E=elig(p),avg={};E.forEach(t=>{const xs=E.map(pid=>notasOf(ansOf(p,pid,aid)?.sent)[t]).filter(x=>x!==undefined&&x!=='').map(Number);avg[t]=xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0});return{avg,share:shares(avg)}}
const partTxt=pt=>Object.keys(pt.avg).filter(k=>pt.avg[k]>0).map(k=>nm(k)+': '+lvName(pt.avg[k]).toLowerCase()).join(' · ')||'Sem participação informada';
const pctTxt=s=>s.v?.divisao==='Sim, a equipe combinou percentuais'?(s.v.titular||[]).concat(s.externo?['__externo__']:[]).map(pid=>(pid==='__externo__'?s.externo:nm(pid))+': '+(s.percentual||{})[pid]+'%').join(' · '):'Não acordados';
const fmtAns=(q,v)=>q==='notas'?(Object.keys(v||{}).filter(k=>hasNota(v,k)).map(k=>nm(k)+': '+lvName(v[k]).toLowerCase()).join(' · ')||'Sem respostas'):isP(q)?((v||[]).map(nm).join(', ')||'Ninguém marcado'):(v||'Não respondida');
let BAR='',SIDE='';
/* Coluna lateral das telas do projeto (status e contexto); a barra de ações também vai para ela. */
const setSide=(html)=>{SIDE+=html};
/* Barra de ações fixa no rodapé: a ação que avança a etapa fica sempre no mesmo lugar, ao alcance do polegar. */
const setBar=(note,btns,k)=>{BAR='<div class="actionbar'+(k?' '+k:'')+'">'+(note?'<p class="note">'+note+'</p>':'')+(btns?'<div class="acts">'+btns+'</div>':'')+'</div>'};
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({people,projects,ui:{me:ui.me,pid:ui.pid,tab:ui.tab,tips:ui.tips,welcome:ui.welcome,introSeen:ui.introSeen,questionIntro:ui.questionIntro,qasset:ui.qasset,qstep:ui.qstep,qpos:ui.qpos,jback:ui.jback,theme:ui.theme}}))}catch(e){}}
function restore(){try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved&&saved.people&&Array.isArray(saved.projects)){people=saved.people;projects=saved.projects;Object.assign(ui,saved.ui||{});ui.tab=ui.tab==='home'||ui.tab==='novo'||!cur()?'home':'proj'}}catch(e){}}
function say(t,kind){const el=$('#toast');el.innerHTML='<div class="'+(kind||'')+'">'+esc(t)+'</div>';clearTimeout(tt);tt=setTimeout(()=>{el.innerHTML=''},4500)}
async function copy(t){try{await navigator.clipboard.writeText(t);say('Texto copiado.')}catch(e){say('Não foi possível copiar. Selecione o texto e copie manualmente.','bad')}}
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return ((h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')).repeat(4)}}

function mkProject(id,name,context,org){return{id,name,context,org,setupStep:'equipe',phase:'coleta',members:[{pid:org,status:'ativo',elig:true}],link:{active:true,code:rid()},assets:[],answers:{},proposal:{},comments:[],versions:[],history:[],memorials:[],ack:{}}}
function sendAns(p,pid,aid,f,at){p.answers[pid]=p.answers[pid]||{};p.answers[pid][aid]={draft:clone(f),sent:Object.assign(clone(f),{at:at||Date.now()})}}

/* ===== Regras (HU-15) ===== */
const norm=(v,q)=>isP(q)?[...(v||[])].sort().join('|'):v;
function itemStatus(p,aid,q){
  if(q==='notas'){const E=elig(p),vals=[];E.forEach(pid=>{const a=ansOf(p,pid,aid);if(a&&a.sent)vals.push({pid,v:notasOf(a.sent)})});
    const spread=E.some(t=>{const xs=vals.filter(x=>hasNota(x.v,t)).map(x=>+x.v[t]);return xs.length>1&&Math.max(...xs)-Math.min(...xs)>2});
    return{status:spread?'div':(!vals.length||vals.length<E.length?'pend':'conv'),vals,missing:E.filter(pid=>!vals.find(x=>x.pid===pid))}}
  const E=elig(p),vals=[];
  E.forEach(pid=>{const a=ansOf(p,pid,aid);if(a&&a.sent)vals.push({pid,v:a.sent[q],ext:q==='titular'?(a.sent.titularExterno||''):''})});
  const set=new Set(vals.map(x=>norm(x.v,q)+(q==='titular'?'|'+x.ext.trim().toLowerCase():'')));
  const status=set.size>1?'div':(vals.length===0||vals.length<E.length?'pend':'conv');
  return{status,vals,missing:E.filter(pid=>!vals.find(x=>x.pid===pid))};
}
function origin(p,aid,q){
  if(q==='notas'){const r=itemStatus(p,aid,q);return elig(p).map(t=>{const xs=r.vals.filter(x=>hasNota(x.v,t)).map(x=>({by:x.pid,n:+x.v[t]}));if(xs.length<2)return'';const lo=xs.reduce((a,b)=>b.n<a.n?b:a),hi=xs.reduce((a,b)=>b.n>a.n?b:a);return hi.n-lo.n>2?'Para '+nm(t)+', as respostas vão de '+lvName(lo.n).toLowerCase()+' ('+nm(lo.by)+') a '+lvName(hi.n).toLowerCase()+' ('+nm(hi.by)+').':''}).filter(Boolean)}
  if(!isP(q))return[];
  const r=itemStatus(p,aid,q);if(r.status!=='div')return[];
  const all=new Set();r.vals.forEach(x=>(x.v||[]).forEach(i=>all.add(i)));
  const out=[];
  all.forEach(pid=>{
    const by=r.vals.filter(x=>(x.v||[]).includes(pid)).map(x=>x.pid),not=r.vals.filter(x=>!(x.v||[]).includes(pid)).map(x=>x.pid);
    if(not.length===0)return;
    out.push(by.map(nm).join(' e ')+(by.length>1?' marcaram ':' marcou ')+nm(pid)+' em “'+QS[q].short+'”; '+not.map(nm).join(' e ')+' não.');
  });
  return out;
}
function allItems(p){const o=[];approved(p).forEach(a=>qsFor(a).forEach(q=>o.push({aid:a.id,q,key:a.id+':'+q,...itemStatus(p,a.id,q)})));return o}

/* ===== Coleta (HU-14, HU-26) ===== */
function vColeta(p){
  const org=p.org===ui.me,E=elig(p),as=approved(p);
  let h=head('Andamento','','Veja quem já respondeu. O conteúdo das respostas fica oculto até o fim.');

  h+='<div class="card"><div class="list">';

    if(m.status==='pendente')return;

    const isE=E.includes(m.pid);
    h+='<div class="li"><div class="l"><b>'+esc(nm(m.pid))+'</b><span class="muted" style="font-size:var(--t-footnote)">'+(isE?sent+' de '+as.length+' criações respondidas':m.status==='naopart'?'Não responde':'Entrou depois das respostas')+'</span></div><div class="row start">'+
    (!isE?chip('Não responde','',1):sent===as.length&&as.length?chip('Concluído','ok',1):sent?chip('Em andamento','warn',1):chip('Não começou','',1))+'</div></div>';
  });

      if(miss.length)h+='<div class="card"><h3>Lembrar quem falta</h3><p class="muted">'+esc(miss.map(nm).join(', '))+(miss.length>1?' ainda não terminaram.':' ainda não terminou.')+'</p><div class="row start">'+miss.map(pid=>btn('remind','Lembrar '+esc(nm(pid)),{c:'sm',d:{pid}})).join('')+btn('remindgrp','Copiar mensagem para o grupo',{c:'sm'})+'</div>'+(ui.flag.grp?'<div class="tok">'+esc(ui.flag.grp)+'</div>':'')+'</div>';
      if(ui.flag.close)setBar(miss.length?esc(miss.map(nm).join(', '))+' ficarão como “Sem resposta”, nunca como concordância. Depois de encerrar, ninguém edita respostas.':'Todas as pessoas responderam. Depois de encerrar, ninguém edita respostas.',btn('closeno','Cancelar')+btn('closeok','Encerrar agora',{c:'pri'}),'warn');

/* ===== Decisões (HU-15 a HU-21): comparação e proposta na mesma tela =====
   Mostra primeiro só os pontos em que as respostas diferem, sem dizer quem respondeu o quê.
   O que todos responderam igual já entra na proposta e fica num bloco recolhido, editável por quem organiza. */
function propOf(p,aid){
  if(!p.proposal[aid]){const a=p.assets.find(x=>x.id===aid),v={};decQs(a).forEach(q=>{const r=itemStatus(p,aid,q);v[q]=r.status==='conv'&&r.vals.length?clone(r.vals[0].v):(isP(q)?[]:'')});const own=itemStatus(p,aid,'titular');p.proposal[aid]={v,externo:own.status==='conv'&&own.vals.length?own.vals[0].ext:'',percentual:{},texto:'',semAcordo:false,saved:false}}
  return p.proposal[aid];
}
const decLine=s=>s.semAcordo?'Ainda sem acordo':s.qs.map(q=>QS[q].short+': '+fmtAns(q,s.v[q])).join(' · ');
const diffCount=p=>approved(p).reduce((s,a)=>s+['notas'].concat(decQs(a)).filter(q=>itemStatus(p,a.id,q).status!=='conv').length,0);
/* Distribuição sem nomes de quem respondeu: quantas pessoas escolheram cada opção ou marcaram cada integrante. */
function distRows(p,aid,q){
  const r=itemStatus(p,aid,q),n=r.vals.length;
  if(q==='notas')return elig(p).map(t=>{const xs=r.vals.filter(x=>hasNota(x.v,t)).map(x=>+x.v[t]);if(!xs.length)return[nm(t),'sem respostas'];const lo=Math.min(...xs),hi=Math.max(...xs);return[nm(t),lvName(lo)===lvName(hi)?lvName(lo):'de '+lvName(lo).toLowerCase()+' a '+lvName(hi).toLowerCase()]});
  if(isP(q))return elig(p).map(t=>[nm(t),r.vals.filter(x=>(x.v||[]).includes(t)).length+' de '+n+' marcaram']).concat(q==='titular'?r.vals.filter(x=>x.ext).map(x=>['Titular fora da equipe indicado',x.ext]):[]);
  const c={};r.vals.forEach(x=>{if(x.v)c[x.v]=(c[x.v]||0)+1});return Object.keys(c).map(o=>[o,c[o]+(c[o]>1?' pessoas':' pessoa')]);
}
function decItem(p,a,q,pr,edit,agreed){

      c+='<div class="qs-list" role="group" aria-labelledby="qs-title">'+E.map(pid=>{const k=r.vals.filter(x=>(x.v||[]).includes(pid)).length;return '<label class="qs-row multi dec-row"><input type="checkbox" data-ch="prop" data-a="'+a.id+'" data-q="'+q+'" data-v="'+pid+'"'+((pr.v[q]||[]).includes(pid)?' checked':'')+'><span>'+esc(nm(pid))+'</span><span class="dec-bar"><i style="width:'+(n?100*k/n:0)+'%"></i></span><b class="dec-n">'+k+' de '+n+'</b></label>'}).join('')+'</div><p class="qs-foot">Pode marcar mais de uma pessoa.</p>';

    }else{
      c+='<div class="qs-list" role="radiogroup" aria-labelledby="qs-title">'+QS[q].opts.map(u=>{const k=r.vals.filter(x=>x.v===u).length;return '<label class="qs-row dec-row"><input type="radio" name="pv-'+a.id+'-'+q+'" data-ch="prop" data-a="'+a.id+'" data-q="'+q+'" data-v="'+esc(u)+'"'+(pr.v[q]===u?' checked':'')+'><span>'+esc(u)+'</span><span class="dec-bar"><i style="width:'+(n?100*k/n:0)+'%"></i></span><b class="dec-n">'+k+' de '+n+'</b></label>'}).join('')+'</div>';
    }
    if(r.missing.length)c+='<p class="qs-foot">'+r.missing.length+(r.missing.length>1?' pessoas não responderam.':' pessoa não respondeu.')+'</p>';
    if(SCEN[q])c+='<details class="dec-more"><summary>Ideias para a conversa</summary><dl class="kv">'+SCEN[q].map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl></details>';
  }
  const back=s?btn('dback','Voltar'):'';
  const pri=q==='review'?btn('saveprop','Salvar decisões de '+esc(a.name),{c:'pri',d:{aid:a.id}}):btn('dnext',s===nq-1?'Revisar decisões':'Próximo ponto',{c:'pri'});
  c+='<div class="qs-actions">'+back+pri+'</div></div><p class="qs-private">Só quem organiza registra. A equipe confirma depois.</p>';
  const top='<header class="qs-top"><button class="qs-exit" data-act="dexit">Sair</button><div class="qs-ctx"><b>Decisões · '+esc(a.name)+'</b><span>Criação '+(as.indexOf(a)+1)+' de '+as.length+'</span></div><span class="qs-count">'+(q==='review'?'Revisão':(s+1)+' de '+nq)+'</span></header>';

  return '<div class="qs">'+top+bar+'<main class="qs-main"><div class="qs-col'+(q==='review'?' wide':'')+'">'+c+'</div></main></div>';
}

/* ===== Confirmação (HU-21 a HU-23) ===== */
function verCard(p,v,curr,extra){
  const E=elig(p),pv=curr&&p.versions.find(x=>x.n===v.n-1);
  const chg=(aid,q)=>{if(!pv)return false;const a=pv.snap[aid],b=v.snap[aid];if(!a)return true;if(q==='semAcordo')return !!a.semAcordo!==!!b.semAcordo;if(q==='part')return partTxt(a.part)!==partTxt(b.part);if(q==='pct')return pctTxt(a)!==pctTxt(b);if(q==='externo')return (a.externo||'')!==(b.externo||'');return fmtAns(q,a.v[q])!==fmtAns(q,b.v[q])};
  const mk=x=>x?' <span class="chg">mudou</span>':'';
  const nChg=pv?Object.keys(v.snap).reduce((t,aid)=>t+(chg(aid,'semAcordo')?1:v.snap[aid].qs.filter(q=>chg(aid,q)).length+(chg(aid,'pct')?1:0)+(chg(aid,'externo')?1:0)),0):0;
  let h='<div class="card"><div class="row"><h3>Proposta '+v.n+'</h3><div class="row start">'+(curr?chip('Atual','acc',1):chip('Anterior','',1))+'<span class="mono muted">'+fmt(v.at)+'</span></div></div>';
  if(pv)h+='<p class="stage-note">'+(nChg?nChg+(nChg>1?' pontos mudaram':' ponto mudou')+' desde a proposta '+pv.n+'.':'Nada mudou desde a proposta '+pv.n+'.')+'</p>';
  h+='<div class="list">'+Object.keys(v.snap).map(aid=>{const s=v.snap[aid];return '<div class="li"><div class="l"><b>'+esc(s.name)+catChip(s.cat)+'</b>'+(s.semAcordo?'<span style="font-size:var(--t-subhead)">Ainda sem acordo'+mk(chg(aid,'semAcordo'))+'</span>':'<dl class="kv ver-kv">'+(s.part?'<dt>Participação percebida</dt><dd>'+esc(partTxt(s.part))+'</dd>':'')+s.qs.map(q=>'<dt>'+esc(QS[q].short)+'</dt><dd>'+esc(fmtAns(q,s.v[q]))+mk(chg(aid,q))+'</dd>').join('')+(s.externo?'<dt>Titular pretendido fora da equipe</dt><dd>'+esc(s.externo)+mk(chg(aid,'externo'))+'</dd>':'')+'<dt>Percentuais acordados</dt><dd>'+esc(pctTxt(s))+mk(chg(aid,'pct'))+'</dd></dl>')+(s.texto?'<span class="muted" style="font-size:var(--t-footnote)">'+esc(s.texto)+'</span>':'')+'</div></div>'}).join('')+'</div>';
  if(!curr)h+='<div class="cmp">'+E.map(pid=>{const c=v.conf[pid];return '<div><b>'+esc(nm(pid))+'</b>'+(c?(c.v==='ok'?chip('Confirmou','ok',1):chip('Recusou','bad',1))+(c.comment?'<span style="font-size:var(--t-footnote)">'+esc(c.comment)+'</span>':'')+'<span class="mono muted">'+fmt(c.at)+'</span>':chip('Pendente','',1))+'</div>'}).join('')+'</div>';
  if(!curr)h+='<p class="stage-note">Versão anterior, disponível apenas para consulta.</p>';
  return h+(extra||'')+'</div>';
}
function vConf(p){
  let h=head('Confirmação','HU-21 HU-22 HU-23','Leia a versão atual antes de confirmar ou recusar. A decisão é individual e silêncio não conta como confirmação.');
  const lv=lastV(p);
  if(!lv)return h+banner('Ainda não há proposta para confirmar. Quem organiza registra as decisões primeiro.','info');
  const E=elig(p),me=ui.me,c=lv.conf[me];
  if(p.phase==='consolidado'){h+=banner('Todas as pessoas confirmaram. O registro do acordo está disponível.','info');setBar('',btn('go','Ver registro do acordo',{c:'pri',d:{tab:'memorial'}}))}
  const sem=Object.values(lv.snap).some(s=>s.semAcordo);
  const allOk=E.every(x=>lv.conf[x]&&lv.conf[x].v==='ok'),semN=Object.values(lv.snap).filter(s=>s.semAcordo).map(s=>s.name).join(', ');
  if(p.phase==='confirmacao'&&allOk&&sem)h+=banner('Todos confirmaram, mas '+esc(semN)+' ficou sem acordo. '+(p.org===me?'Quando a equipe decidir, reabra a proposta e registre a decisão.':'Quando a equipe decidir, '+esc(nm(p.org))+' envia uma nova proposta.'),'warn',p.org===me?btn('editask','Reabrir proposta',{c:'sm'}):'');
  if(ui.flag.edit&&p.phase==='confirmacao')setBar('Editar cria a proposta '+(lv.n+1)+' e invalida as confirmações já feitas.',btn('editno','Cancelar')+btn('editok','Criar proposta '+(lv.n+1),{c:'pri'}),'warn');
  const can=p.phase==='confirmacao'&&E.includes(me)&&!c,isOrg=p.org===me,ra=ui.refAssets||[];
  const refForm='<div class="field"><div class="q" id="rfa">O que precisa mudar?</div><p class="muted" style="margin:0">Marque as criações. Elas voltam para '+esc(nm(p.org))+' revisar.</p><div class="opts" role="group" aria-labelledby="rfa">'+Object.keys(lv.snap).map(aid=>'<label class="opt"><input type="checkbox" data-ch="refa" data-v="'+aid+'"'+(ra.includes(aid)?' checked':'')+'>'+esc(lv.snap[aid].name)+'</label>').join('')+'</div>'+errm('refa')+'</div><div class="field"><label for="rf">Por quê?</label><textarea id="rf" data-in="refuse" placeholder="Ex.: Acho que a divisão do Backend deveria seguir a contribuição">'+esc(ui.refuse)+'</textarea>'+errm('refuse')+'</div><p class="muted" style="margin:0">A equipe vê seu nome e o motivo. A proposta volta para ajuste e todos confirmam a nova versão.</p>';
  const pos=can?'<div class="pos"><h3>'+(ui.flag.refusing?'Recusar a proposta '+lv.n:'Seu posicionamento')+'</h3>'+(ui.flag.refusing?refForm:'<p class="muted">'+(isOrg?'Você montou esta proposta. Confirme se ela está certa, ou edite antes que todos se posicionem.':'Confirme se a proposta representa o que a equipe combinou. Se algo precisar mudar, recuse e diga o quê.')+'</p>')+'</div>':'';
  if(can&&!ui.flag.edit)setBar('',ui.flag.refusing?btn('refuseno','Cancelar')+btn('refuse','Enviar recusa',{c:'bad',d:{n:lv.n}}):(isOrg?btn('editask','Editar proposta'):btn('refuse','Recusar',{d:{n:lv.n}}))+btn('conf','Confirmar proposta',{c:'pri',d:{n:lv.n}}));
  {const n=E.filter(x=>lv.conf[x]?.v==='ok').length;setSide('<section class="side-card"><div class="row"><h3>Confirmações</h3><span class="muted">'+n+' de '+E.length+'</span></div><div class="team">'+E.map(pid=>{const c=lv.conf[pid];return '<div class="team-row"><span><b>'+esc(nm(pid))+'</b>'+(pid===me?' <span class="muted">(você)</span>':'')+(c&&c.comment?'<span class="muted conf-note">'+esc(c.comment)+'</span>':'')+'</span><span class="team-st">'+(c?(c.v==='ok'?chip('Confirmou','ok',1):chip('Recusou','bad',1)):chip('Pendente','',1))+'</span></div>'}).join('')+'</div></section>')}
  h+=verCard(p,lv,true,pos);
  if(p.phase==='confirmacao'){
    if(!E.includes(me))h+=naoElig();
    else if(c&&!allOk)h+=banner('Sua confirmação foi registrada. Aguarde a posição das demais pessoas; ausência de resposta não significa concordância.','info');
  }
  if(p.versions.length>1)h+='<details class="more"><summary>Versões anteriores ('+(p.versions.length-1)+')</summary><div class="sec">'+p.versions.slice(0,-1).reverse().map(v=>verCard(p,v,false)).join('')+'</div></details>';
  return h;
}

/* ===== Memorial (HU-24, HU-25) ===== */
function memorialBody(p,at){
  const v=lastV(p),L=[],E=elig(p),allOk=E.every(pid=>v.conf[pid]?.v==='ok');
  L.push('MEMORIAL DE CONTRIBUIÇÕES E DECISÕES');
  L.push('Projeto: '+p.name+' ('+(p.context||'sem contexto')+')');
  L.push('Situação da proposta '+v.n+': '+(allOk?'confirmada por todos':'em confirmação'));
  L.push('Gerado em: '+fmt(at));L.push('');
  L.push('PARTICIPANTES');
  p.members.forEach(m=>L.push('- '+nm(m.pid)+', '+roleTxt(p,m.pid).toLowerCase()+(m.status==='naopart'?' (não respondeu)':m.status==='pendente'?' (convite pendente)':!m.elig?' (entrou depois das respostas)':'')));
  L.push('');L.push('SITUAÇÃO POR CRIAÇÃO');
  approved(p).forEach(a=>{
    const x=v.snap[a.id];if(!x)return;
    L.push('');L.push(a.name+' ('+(a.cat||'criação')+')');
    if(x.desc)L.push('  Descrição: '+x.desc);
    if(x.link)L.push('  Link da criação: '+x.link);
    L.push('  Estado da decisão: '+(x.semAcordo?'SEM ACORDO':'proposta registrada'));
    L.push('  Participação percebida: '+(x.part?partTxt(x.part):'não informada')+'. Não define titularidade ou quotas.');
    L.push('  Relatos individuais sobre origem e titularidade atual:');
    (x.relatos||[]).forEach(r=>{
      L.push('  - '+nm(r.pid)+': '+(r.respondido?'respondeu':'não respondeu'));
      if(r.respondido){
        L.push('    Origem declarada: '+(r.origem||'não informada'));
        L.push('    Titularidade atual declarada: '+(r.titularAtual||'não informada'));
        L.push('    Titular indicado hoje: '+(r.titularAtualNome||'não informado'));
        if(r.titularExterno)L.push('    Titular pretendido fora da equipe, segundo esta pessoa: '+r.titularExterno);
        L.push('    Base ou documento: '+(r.titularAtualBase||'não informado'));
        L.push('    Contribuição descrita: '+(r.desc||'não descrita'));
        L.push('    Evidência: '+(r.evidencia||'não informada'));
      }
    });
    L.push('  Decisões e condições propostas:');
    (x.qs||[]).forEach(q=>L.push('  - '+QS[q].short+': '+fmtAns(q,x.v[q])));
    if(x.externo)L.push('  - Titular pretendido fora da equipe: '+x.externo);
    L.push('  Percentuais de titularidade combinados: '+pctTxt(x));
    if(x.texto)L.push('  Explicações e pendências anotadas: '+x.texto);
    const pend=[];
    if(x.semAcordo)pend.push('decisão da criação ainda sem acordo');
    if(x.v.divisao==='Ainda não, precisamos negociar')pend.push('percentuais ainda não negociados');
    if(x.v.titularAtual==='Ainda não sabemos')pend.push('titularidade atual a verificar');
    if(x.v.origem==='Não sei')pend.push('origem a verificar');
    if(x.v.terceiros==='Sim, autorização pendente'||x.v.terceiros==='Ainda não sabemos')pend.push('direitos de terceiros a verificar');
    if(x.v.audioDireitos==='Autorização pendente'||x.v.audioDireitos==='Ainda não sabemos')pend.push('autorizações de áudio a verificar');
    if(x.v.marcaRegistro==='Ainda precisa de busca ou registro'||x.v.marcaRegistro==='Há conflito ou uso de terceiro')pend.push('situação da marca a verificar');
    if(x.v.invDivulgacao==='Ainda não sabemos'||x.v.invDivulgacao==='Avaliar proteção e confidencialidade antes')pend.push('condições de divulgação a definir');
    L.push('  Pendências identificadas: '+(pend.join('; ')||'nenhuma marcada na proposta'));
  });
  L.push('');L.push('CONFIRMAÇÕES DA PROPOSTA '+v.n);
  E.forEach(pid=>{const c=v.conf[pid];L.push('- '+nm(pid)+': '+(c?(c.v==='ok'?'confirmou':'recusou ('+c.comment+')')+' em '+fmt(c.at):'ainda não se posicionou'))});
  const ref=[];p.versions.forEach(x=>Object.keys(x.conf).forEach(k=>{if(x.conf[k].v==='no')ref.push('- '+nm(k)+' recusou a proposta '+x.n+': '+x.conf[k].comment)}));
  if(ref.length){L.push('');L.push('RECUSAS E AJUSTES ANTERIORES');ref.forEach(r=>L.push(r))}
  L.push('');L.push(LIMITS);
  return L.join('\n');
}

 equipe:'Adicione quem participou do projeto. Cada pessoa responde em particular sobre cada criação.',

function vWelcome(p){return '<div class="intro-card welcome"><div class="intro-art">✳</div><div><h3>Como a MIP funciona</h3><ol><li><b>Cada pessoa responde em particular.</b> Ninguém vê suas respostas até o fim.</li><li><b>A equipe decide só o que diverge.</b> O que todos concordaram já fica combinado.</li><li><b>Todos confirmam.</b> As decisões ficam no registro do acordo.</li></ol><p class="muted" style="margin-top:14px;font-size:var(--t-subhead)">A MIP organiza as decisões da equipe. Ela não substitui contrato, advogado ou registro oficial.</p><div class="row start" style="margin-top:18px">'+btn('welcome','Começar',{c:'pri'})+'</div></div></div>'}
function taskFor(p,pid=ui.me){

    if(!as.length)return{tab:'ativos',label:'Aguardando as criações',note:'Quem organiza está cadastrando o que a equipe criou. Você pode sugerir uma criação.',cta:'Ver criações'};

    if(org){const miss=elig(p).filter(x=>as.some(a=>!ansOf(p,x,a.id)?.sent));return{tab:'coleta',label:miss.length?'Aguardando a equipe':'Todos responderam',note:miss.length?'Faltam respostas de '+miss.length+' pessoa'+(miss.length>1?'s':'')+'. Você pode lembrar ou encerrar mesmo assim.':'Encerre as respostas para decidir com a equipe.',cta:miss.length?'Ver andamento':'Encerrar respostas'}}
    return{tab:'proj',label:'Você está em dia',note:'Suas respostas foram enviadas. Avisaremos quando a proposta estiver pronta.'};
  }
  if(p.phase==='decisao'){const lv=lastV(p),rf=lv?Object.keys(lv.conf).filter(k=>lv.conf[k].v==='no'):[];if(rf.length){const r=lv.conf[rf[0]],who=nm(rf[0]),ats=(r.assets||[]).map(x=>lv.snap[x]?.name).filter(Boolean).join(', ');
    if(org)return{tab:'decidir',label:'Ajustar a proposta',note:who+' recusou a proposta '+lv.n+(ats?' e pediu ajuste em '+ats:'')+': "'+r.comment+'"',cta:'Ajustar proposta'};

    if(p.phase==='coleta'){

  case 'tryedit':say('Ação bloqueada: as respostas foram encerradas.','bad');break;

      if(!ps.length||ps.some(pid=>(pr.percentual||{})[pid]===''||(pr.percentual||{})[pid]===undefined)||vals.some(n=>!Number.isFinite(n)||n<0||n>100)||Math.abs(vals.reduce((a,b)=>a+b,0)-100)>0.001){ui.err['p'+d.aid]='Informe percentuais válidos para todos os titulares pretendidos, somando 100%.';break}
    }
    pr.saved=true;pr.by=me;pr.at=Date.now();delete pr.ajuste;{const nx=approved(p).find(a=>!propOf(p,a.id).saved);ui.flag.dsaved=d.aid;if(nx&&ui.dq){ui.dq=nx.id;ui.dstep=0;ui.scrollQ=true}else ui.dq=null}log(p,me,'registrou a proposta de '+p.assets.find(x=>x.id===d.aid).name);say(pr.semAcordo?'Criação registrada como sem acordo. O acordo não fecha enquanto isso valer.':'Proposta salva.');break}
  case 'tryprop':say('Ação negada: só quem organiza altera a proposta. Use o comentário.','bad');break;
  case 'comment':{const t=(ui.cmt[d.aid]||'').trim();if(!t){say('Escreva o comentário antes de enviar.','bad');break}p.comments.push({aid:d.aid,pid:me,text:t,at:Date.now()});ui.cmt[d.aid]='';say('Comentário registrado. A proposta não foi alterada.');break}
  case 'sendv':{
    if(p.org!==me||p.phase!=='decisao')break;
    const as=approved(p);if(!as.length){ui.err.send='Cadastre ao menos uma criação antes de enviar.';break}if(as.some(a=>!(propOf(p,a.id).saved||propOf(p,a.id).semAcordo&&propOf(p,a.id).saved))){ui.err.send='Conclua a proposta de todas as criações antes de enviar.';break}
    const snap={};as.forEach(a=>{const pr=p.proposal[a.id];snap[a.id]={name:a.name,cat:a.cat,desc:a.desc||'',link:a.link||'',part:partOf(p,a.id),qs:decQs(a),v:clone(pr.v),externo:pr.externo||'',percentual:clone(pr.percentual||{}),texto:pr.texto,semAcordo:pr.semAcordo,relatos:elig(p).map(pid=>{const x=ansOf(p,pid,a.id)?.sent;return{pid,respondido:!!x,desc:x?.desc||'',evidencia:x?.link||'',origem:x?.origem||'',titularAtual:x?.titularAtual||'',titularAtualNome:x?.titularAtualNome||'',titularAtualBase:x?.titularAtualBase||'',titularExterno:x?.titularExterno||''}})}});
    const n=p.versions.length+1;p.versions.push({n,at:Date.now(),snap,conf:{}});p.phase='confirmacao';log(p,me,'enviou a proposta '+n+' para confirmação');ui.tab='conf';ui.notice='Proposta enviada. Cada pessoa confirma ou recusa individualmente.';say('Proposta enviada para confirmação.');break}
  case 'editask':ui.flag.edit=true;break;
  case 'editno':ui.flag={};break;
  case 'editok':{if(p.org!==me||p.phase!=='confirmacao')break;p.phase='decisao';ui.flag={};log(p,me,'reabriu a proposta; o próximo envio criará a proposta '+(p.versions.length+1));ui.tab='decidir';break}
  case 'oldconf':{const lv=lastV(p);say('Ação negada: só a proposta atual pode ser confirmada.','bad');break}
  case 'refuseno':ui.flag={};ui.refuse='';ui.refAssets=[];break;
  case 'conf':case 'refuse':{
    if(a==='refuse'&&!ui.flag.refusing){ui.flag.refusing=true;ui.focus='rf';break}
    const lv=lastV(p);if(+d.n!==lv.n||p.phase!=='confirmacao'){say('Ação negada: só é possível se posicionar sobre a versão atual.','bad');break}

      lv.conf[me]={v:'no',comment:ui.refuse.trim(),assets:ra,at:Date.now()};ra.forEach(x=>{const pr=propOf(p,x);pr.saved=false;pr.ajuste={by:me,comment:ui.refuse.trim()}});
      p.phase='decisao';ui.tab='proj';ui.notice='Recusa enviada. '+nm(p.org)+' vai revisar '+ra.map(x=>lv.snap[x].name).join(', ')+' e enviar a proposta '+(lv.n+1)+' para todos.';ui.refuse='';ui.refAssets=[];ui.flag={};log(p,me,'recusou a proposta '+lv.n+' e pediu ajuste em '+ra.map(x=>lv.snap[x].name).join(', '));say('Recusa enviada.');break}
    lv.conf[me]={v:'ok',comment:'',at:Date.now()};log(p,me,'confirmou a proposta '+lv.n);

function delAsset(p,aid){const x=p.assets.find(y=>y.id===aid);p.assets=p.assets.filter(y=>y.id!==aid);Object.values(p.answers).forEach(o=>delete o[aid]);delete p.proposal[aid];log(p,ui.me,'excluiu a criação '+x.name+' e descartou as respostas');say('Criação excluída e registrada no histórico.')}
function sendAnswer(p,aid){
  if(!approved(p).some(a=>a.id===aid))return false;
  if(p.phase!=='coleta'||!elig(p).includes(ui.me))return false;
  const me=ui.me,an=ensureAns(p,me,aid),d=an.draft,E=elig(p),a=p.assets.find(x=>x.id===aid);
  let bad=false;
  qsFor(a).forEach(q=>{if(q==='notas'){const n=notasOf(d),o={};E.forEach(pid=>{if(hasNota(n,pid))o[pid]=+n[pid]});d.notas=o;if(!E.every(pid=>hasNota(o,pid))){ui.err[aid+':notas']='Escolha a participação percebida de cada pessoa';bad=true}return}if(isP(q))d[q]=(d[q]||[]).filter(x=>E.includes(x));if(isP(q)?!d[q].length&&!(q==='titular'&&(d.titularExterno||'').trim()):!d[q]){ui.err[aid+':'+q]='Responda esta pergunta para enviar';bad=true}});
  if(contribOf(d).includes(me)&&!(d.desc||'').trim()){ui.err[aid+':desc']='Conte em uma frase o que você fez';bad=true}
  if((d.link||'').trim()&&!/^https?:\/\/\S+$/i.test(d.link.trim())){ui.err[aid+':link']='Informe um link válido, começando com http';bad=true}
  if(bad){ui.qstep=Math.max(0,steps(a,d).findIndex(g=>(GROUPS[g]||[]).some(q=>ui.err[aid+':'+q])||g==='contrib'&&ui.err[aid+':link']));ui.scrollQ=true;say('Falta uma resposta. Levamos você até ela.','bad');return false}
  const had=!!an.sent;d.link=(d.link||'').trim();an.sent=Object.assign(clone(d),{at:Date.now()});
  log(p,me,(had?'alterou':'enviou')+' as respostas de '+p.assets.find(x=>x.id===aid).name);
  say('Respostas de '+p.assets.find(x=>x.id===aid).name+' registradas em '+fmt(an.sent.at)+'.');
  return true;
}
async function genMem(p){const at=Date.now(),body=memorialBody(p,at),hash=await sha(body);p.memorials.unshift({at,body,hash});log(p,ui.me,'gerou o registro do acordo');say('Registro do acordo gerado com código de verificação.');render()}
async function doVerify(){
  const t=ui.verifyText.replace(/\n*Código de verificação \(SHA-256\):.*$/s,'');
  if(!ui.verifyText.trim()){ui.verify={ok:false,msg:'Cole o texto do registro para verificar.'};render();return}
  const h=await sha(t);let f=null;projects.forEach(p=>p.memorials.forEach(m=>{if(m.hash===h)f=m}));
  ui.verify=f?{ok:true,msg:'Este texto corresponde ao registro gerado em '+fmt(f.at)}:{ok:false,msg:'Este texto não corresponde a nenhum registro gerado pela MIP'};render();
}

/* ===== Eventos ===== */
/* Mantém o painel de testes aberto entre redesenhos da tela. */
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('demo'))ui.demoOpen=e.target.open},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset)});
document.addEventListener('input',e=>{
  const t=e.target,x=t.dataset;if(!x.in)return;const p=cur();
  if(x.in==='inv')ui.inv=t.value;
  else if(x.in==='refuse')ui.refuse=t.value;
  else if(x.in==='vtext')ui.verifyText=t.value;
  else if(x.in==='refsug')ui.refSug[x.a]=t.value;
  else if(x.in==='cmt')ui.cmt[x.a]=t.value;
  else if(x.in==='novo')ui.novo[x.k]=t.value;
  else if(x.in==='addA'||x.in==='sug')ui[x.in][x.k]=t.value;
  else if(x.in==='ans'){ensureAns(p,ui.me,x.a).draft[x.k]=t.value;persist()}
  else if(x.in==='nota'){const d=ensureAns(p,ui.me,x.a).draft;d.notas=d.notas||{};let v=t.value.trim();if(v!==''){v=Math.max(0,Math.min(10,Math.round(+v)||0));if(String(v)!==t.value)t.value=v}d.notas[x.v]=v;const sh=shares(Object.fromEntries(Object.entries(d.notas).filter(([k,n])=>n!=='')));document.querySelectorAll('[data-pct]').forEach(el=>{const k=el.dataset.pct;el.textContent=hasNota(d.notas,k)?sh[k]+'%':''});const er=t.closest('.qs-card')&&t.closest('.qs-card').querySelector('.err');if(er)er.remove()}
  else if(x.in==='prop'){const pr=propOf(p,x.a);pr[x.k]=t.value;pr.saved=false}
  else if(x.in==='pct'){const pr=propOf(p,x.a);pr.percentual=pr.percentual||{};pr.percentual[x.pid]=t.value;pr.saved=false}
  persist();
});
document.addEventListener('change',e=>{
  const t=e.target,x=t.dataset;if(!x.ch)return;const p=cur();
  if(x.ch==='who'){ui.me=t.value;ui.err={};ui.flag={};ui.refuse='';ui.notice='';ui.qasset=null;ui.qstep=0;ui.dasset=null;ui.open=null;ui.tab=p&&mem(p,ui.me)?'proj':'home'}
  else if(x.ch==='proj'){ui.pid=t.value;ui.err={};ui.flag={};ui.open=null;ui.tab='proj';ui.qasset=null}
  else if(x.ch==='ans'){const d=ensureAns(p,ui.me,x.a).draft;ui.err={};if(!isP(x.q))d[x.q]=x.v;else{d[x.q]=d[x.q]||[];const i=d[x.q].indexOf(x.v);i<0?d[x.q].push(x.v):d[x.q].splice(i,1)}}
  else if(x.ch==='nota'){const dr=ensureAns(p,ui.me,x.a).draft;dr.notas=dr.notas||{};dr.notas[x.v]=+t.dataset.n;delete ui.err[x.a+':notas']}
  else if(x.ch==='refa'){ui.refAssets=ui.refAssets||[];const i=ui.refAssets.indexOf(x.v);i<0?ui.refAssets.push(x.v):ui.refAssets.splice(i,1);delete ui.err.refa}
  else if(x.ch==='prop'){const pr=propOf(p,x.a);pr.saved=false;ui.err={};if(x.q==='sem')pr.semAcordo=t.checked;else if(!isP(x.q))pr.v[x.q]=x.v;else{pr.v[x.q]=pr.v[x.q]||[];const i=pr.v[x.q].indexOf(x.v);i<0?pr.v[x.q].push(x.v):pr.v[x.q].splice(i,1)}}

});

/* Nas perguntas, Enter avança (exceto no campo de texto longo e em botões, que já reagem ao Enter). */
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&!e.shiftKey&&document.body.classList.contains('focus-mode')&&t.tagName!=='TEXTAREA'&&t.tagName!=='BUTTON'){const b=$('.qs-actions .btn.pri');if(b){e.preventDefault();b.click()}}});
